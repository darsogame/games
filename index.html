<body>

<div class="login-box">

  <div class="status-box" id="statusBox"></div>

  <label class="field-label">🔑 کد کاربری:</label>
  <div class="key-input-wrap">
    <input 
      type="password" 
      id="keyInput" 
      class="key-input" 
      placeholder="کد کاربری خود را وارد کنید..."
      autocomplete="off"
      spellcheck="false"
    />
    <button class="key-toggle" onclick="toggleKeyVisibility()" title="نمایش/مخفی">👁️</button>
  </div>

  <button class="login-btn" id="loginBtn" onclick="loginWithKey()">
    🔓 ورود با کد
  </button>

  <div class="divider">یا</div>

  <button class="guest-btn" onclick="loginAsGuest()">
    👤 ورود به‌عنوان مهمان

  <div class="ip-info">
    IP شما: <strong id="userIp">در حال دریافت...</strong>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   🔐 سیستم ورود با User Key + محدودیت IP
   ══════════════════════════════════════════════════════════════ */

const USERS_FILE = 'users.json';
const STORAGE_KEY = 'lingo_auth';
const IP_API = 'https://api.ipify.org?format=json';

let currentIP = null;
let usersData = null;

/* ═══ ۱. دریافت IP کاربر ═══ */
async function fetchUserIP() {
  try {
    const response = await fetch(IP_API, { cache: 'no-store' });
    const data = await response.json();
    currentIP = data.ip;
    document.getElementById('userIp').textContent = currentIP;
    return currentIP;
  } catch (err) {
    console.warn('خطا در دریافت IP:', err);
    document.getElementById('userIp').textContent = 'نامشخص';
    return null;
  }
}

/* ═══ ۲. بارگذاری فایل users.json ═══ */
async function loadUsers() {
  try {
    const response = await fetch(USERS_FILE, { cache: 'no-store' });
    if (!response.ok) throw new Error('فایل users.json پیدا نشد');
    usersData = await response.json();
    console.log('✅ فایل کاربران بارگذاری شد');
    return usersData;
  } catch (err) {
    console.error('❌ خطا در بارگذاری کاربران:', err);
    showStatus('error', '❌ فایل کاربران (users.json) پیدا نشد');
    return null;
  }
}

/* ═══ ۳. نمایش وضعیت ═══ */
function showStatus(type, message) {
  const box = document.getElementById('statusBox');
  box.className = 'status-box show ' + type;
  box.innerHTML = message;
}

/* ═══ ۴. مخفی/نمایش کد ═══ */
function toggleKeyVisibility() {
  const input = document.getElementById('keyInput');
  const btn = event.target;
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

/* ═══ ۵. ورود با کد کاربری ═══ */
async function loginWithKey() {
  const keyInput = document.getElementById('keyInput');
  const key = keyInput.value.trim();
  const btn = document.getElementById('loginBtn');

  if (!key) {
    showStatus('error', '⚠️ لطفاً کد کاربری خود را وارد کنید');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> در حال بررسی...';

  // اطمینان از بارگذاری کاربران
  if (!usersData) {
    await loadUsers();
  }

  if (!usersData || !usersData.users) {
    showStatus('error', '❌ فایل کاربران در دسترس نیست');
    btn.disabled = false;
    btn.innerHTML = '🔓 ورود با کد';
    return;
  }

  // اطمینان از دریافت IP
  if (!currentIP) {
    await fetchUserIP();
  }

  // پیدا کردن کاربر با این کلید
  const user = usersData.users.find(u => u.key === key);

  if (!user) {
    showStatus('error', '❌ کد کاربری نامعتبر است');
    btn.disabled = false;
    btn.innerHTML = '🔓 ورود با کد';
    return;
  }

  // بررسی محدودیت IP
  if (user.ip && user.ip !== 'null' && user.ip !== '' && user.ip !== currentIP) {
    showStatus('error', 
      `🚫 این کد قبلاً از IP دیگری استفاده شده است!<br>
       <span style="font-size:12px; opacity:0.8;">IP ثبت‌شده: ${user.ip}<br>IP فعلی: ${currentIP}</span>`
    );
    btn.disabled = false;
    btn.innerHTML = '🔓 ورود با کد';
    return;
  }

  // ثبت IP در صورت اولین ورود
  if (!user.ip || user.ip === 'null' || user.ip === '') {
    user.ip = currentIP;
    // ذخیره در localStorage (چون نمی‌توانیم فایل JSON را تغییر دهیم)
    saveUserIP(user.key, currentIP);
    showStatus('success', 
      `✅ خوش آمدید ${user.name || 'کاربر'}!<br>
       <span style="font-size:12px; opacity:0.8;">IP شما ثبت شد: ${currentIP}</span>`
    );
  } else {
    showStatus('success', `✅ خوش آمدید ${user.name || 'کاربر'}!`);
  }

  // ذخیره وضعیت ورود
  const session = {
    type: 'user',
    key: user.key,
    name: user.name,
    ip: currentIP,
    loginTime: Date.now(),
    permissions: user.permissions || ['game', 'lesson', 'listening', 'reading', 'writing', 'speaking']
  };

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
  } catch (err) {
    console.warn('خطا در ذخیره session:', err);
  }

  // انتقال به صفحه اصلی
  setTimeout(() => {
    window.location.href = 'hub.html';
  }, 1200);
}

/* ═══ ۶. ذخیره IP کاربر در localStorage ═══ */
function saveUserIP(key, ip) {
  try {
    const ipStore = JSON.parse(localStorage.getItem('lingo_user_ips') || '{}');
    ipStore[key] = ip;
    localStorage.setItem('lingo_user_ips', JSON.stringify(ipStore));
    console.log(`✅ IP کاربر ${key} ثبت شد: ${ip}`);
  } catch (err) {
    console.warn('خطا در ذخیره IP:', err);
  }
}

/* ═══ ۷. بازیابی IP کاربران از localStorage ═══ */
function restoreUserIPs() {
  if (!usersData || !usersData.users) return;
  try {
    const ipStore = JSON.parse(localStorage.getItem('lingo_user_ips') || '{}');
    usersData.users.forEach(user => {
      if (ipStore[user.key] && (!user.ip || user.ip === 'null')) {
        user.ip = ipStore[user.key];
      }
    });
  } catch (err) {
    console.warn('خطا در بازیابی IP:', err);
  }
}

/* ═══ ۸. ورود به‌عنوان مهمان ═══ */
function loginAsGuest() {
  const session = {
    type: 'guest',
    name: 'مهمان',
    ip: currentIP,
    loginTime: Date.now(),
    permissions: ['game']  // فقط بازی
  };

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
  } catch (err) {
    console.warn('خطا در ذخیره session:', err);
  }

  showStatus('info', '👤 ورود به‌عنوان مهمان...');

  setTimeout(() => {
    window.location.href = 'index2.html';
  }, 800);
}

/* ═══ ۹. بررسی session موجود ═══ */
async function checkExistingSession() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return false;
    
    const session = JSON.parse(stored);
    
    // اگر خیلی قدیمی است (بیش از ۷ روز)، حذف کن
    if (Date.now() - session.loginTime > 7 * 24 * 60 * 60 * 1000) {
      localStorage.removeItem(STORAGE_KEY);
      return false;
    }

    // بررسی IP
    if (session.type === 'user' && session.ip && session.ip !== currentIP) {
      showStatus('error', 
        `🚫 IP شما تغییر کرده!<br>
         <span style="font-size:12px;">IP اصلی: ${session.ip}<br>IP فعلی: ${currentIP}</span>`
      );
      localStorage.removeItem(STORAGE_KEY);
      return false;
    }

    return session;
  } catch (err) {
    return false;
  }
}

/* ═══ ۱۰. راه‌اندازی ═══ */
window.addEventListener('load', async () => {
  // دریافت IP
  await fetchUserIP();
  
  // بارگذاری کاربران
  await loadUsers();
  
  // بازیابی IP کاربران
  restoreUserIPs();

  // بررسی session موجود
  const existingSession = await checkExistingSession();
  if (existingSession) {
    showStatus('info', 
      `✅ شما قبلاً وارد شده‌اید (${existingSession.name})<br>
       <span style="font-size:12px;">در حال انتقال...</span>`
    );
    setTimeout(() => {
      if (existingSession.type === 'user') {
        window.location.href = 'hub.html';
      } else {
        window.location.href = 'index2.html';
      }
    }, 1500);
  }

  // Enter برای ورود
  document.getElementById('keyInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginWithKey();
  });
});
</script>
