<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انگلیسی A1 - دوره کامل | Darsogame</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    color: #e2e8f0;
    padding: 25px 18px;
  }
  .container { max-width: 900px; margin: 0 auto; }

  /* ═══ نوار بالا ═══ */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 22px;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; background: rgba(56,189,248,0.15);
    border: 2px solid rgba(56,189,248,0.3); border-radius: 12px;
    color: #38bdf8; text-decoration: none; font-weight: 900; font-size: 13px;
    transition: all 0.25s;
  }
  .back-btn:hover { background: rgba(56,189,248,0.3); transform: translateY(-2px); }
  .level-pill {
    padding: 8px 20px; background: linear-gradient(135deg, #38bdf8, #a78bfa);
    border-radius: 20px; color: #0f172a; font-weight: 900; font-size: 14px;
    font-family: 'Courier New', monospace;
  }

  /* ═══ نوار پیشرفت ═══ */
  .progress-wrap {
    background: rgba(15,23,42,0.7); border: 2px solid rgba(56,189,248,0.25);
    border-radius: 18px; padding: 16px 20px; margin-bottom: 25px;
  }
  .progress-info {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 13px; font-weight: 900;
  }
  .progress-info .stage-label { color: #38bdf8; }
  .progress-info .score-label { color: #fbbf24; }
  .progress-bar {
    height: 12px; background: rgba(148,163,184,0.2);
    border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #38bdf8, #a78bfa, #fbbf24);
    border-radius: 10px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* ═══ کارت صحنه ═══ */
  .scene-card {
    background: linear-gradient(135deg, #1e293b, #334155);
    border: 2px solid rgba(56,189,248,0.2);
    border-radius: 22px; padding: 28px 24px;
    margin-bottom: 22px; min-height: 300px;
  }
  .scene-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid rgba(148,163,184,0.15);
  }
  .scene-icon { font-size: 34px; }
  .scene-titles h3 { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 3px; }
  .scene-titles p { font-size: 12px; color: #94a3b8; }

  /* ═══ دکمه‌ها ═══ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px; border-radius: 14px; font-family: inherit;
    font-size: 14px; font-weight: 900; cursor: pointer; border: none;
    transition: all 0.25s; outline: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #38bdf8, #a78bfa); color: #0f172a;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(56,189,248,0.4); }
  .btn-secondary {
    background: rgba(148,163,184,0.15); color: #cbd5e1;
    border: 2px solid rgba(148,163,184,0.3);
  }
  .btn-secondary:hover { background: rgba(148,163,184,0.25); }
  .btn-success {
    background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff;
  }
  .btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(34,197,94,0.4); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

  /* ═══ گزینه‌ها ═══ */
  .options-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px;
  }
  .option-btn {
    padding: 16px 18px; background: rgba(15,23,42,0.6);
    border: 2px solid rgba(148,163,184,0.25); border-radius: 14px;
    color: #e2e8f0; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; text-align: center; outline: none;
  }
  .option-btn:hover:not(:disabled) {
    border-color: #38bdf8; background: rgba(56,189,248,0.1);
    transform: translateY(-2px);
  }
  .option-btn.correct {
    border-color: #22c55e; background: rgba(34,197,94,0.2); color: #86efac;
  }
  .option-btn.wrong {
    border-color: #ef4444; background: rgba(239,68,68,0.2); color: #fca5a5;
  }
  .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }

  /* ═══ ورودی متن ═══ */
  .text-input {
    width: 100%; padding: 14px 18px; background: rgba(15,23,42,0.6);
    border: 2px solid rgba(148,163,184,0.25); border-radius: 14px;
    color: #fff; font-family: inherit; font-size: 16px; outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: #38bdf8; }
  .text-input.correct { border-color: #22c55e; background: rgba(34,197,94,0.1); }
  .text-input.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }

  /* ═══ سوال ═══ */
  .question-text {
    font-size: 17px; font-weight: 700; color: #fff; line-height: 1.7;
    margin-bottom: 6px;
  }
  .question-hint { font-size: 12px; color: #94a3b8; margin-bottom: 18px; }
  .english-word {
    font-size: 28px; font-weight: 900; color: #38bdf8;
    font-family: 'Courier New', monospace; direction: ltr;
    text-align: center; padding: 16px; margin: 10px 0;
    background: rgba(56,189,248,0.08); border-radius: 14px;
    border: 1px dashed rgba(56,189,248,0.3);
  }

  /* ═══ بازخورد ═══ */
  .feedback {
    margin-top: 16px; padding: 14px 18px; border-radius: 14px;
    font-size: 14px; font-weight: 700; line-height: 1.6; display: none;
  }
  .feedback.show { display: block; }
  .feedback.success {
    background: rgba(34,197,94,0.15); border: 2px solid rgba(34,197,94,0.4); color: #86efac;
  }
  .feedback.error {
    background: rgba(239,68,68,0.15); border: 2px solid rgba(239,68,68,0.4); color: #fca5a5;
  }
  .feedback.info {
    background: rgba(251,191,36,0.15); border: 2px solid rgba(251,191,36,0.4); color: #fbbf24;
  }

  /* ═══ میکروفون ═══ */
  .mic-area { text-align: center; padding: 20px; }
  .mic-btn {
    width: 90px; height: 90px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ef4444, #f97316);
    color: #fff; font-size: 36px; cursor: pointer;
    transition: all 0.25s; box-shadow: 0 10px 25px rgba(239,68,68,0.4);
  }
  .mic-btn:hover { transform: scale(1.08); }
  .mic-btn.recording {
    animation: pulse 1s infinite;
    background: linear-gradient(135deg, #22c55e, #16a34a);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
    50% { box-shadow: 0 0 0 20px rgba(34,197,94,0); }
  }
  .mic-status { font-size: 13px; color: #94a3b8; margin-top: 12px; font-weight: 700; }

  /* ═══ نتیجه نهایی ═══ */
  .result-screen { text-align: center; padding: 30px 20px; }
  .result-emoji { font-size: 80px; margin-bottom: 20px; }
  .result-title { font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 12px; }
  .result-score {
    font-size: 52px; font-weight: 900; font-family: 'Courier New', monospace;
    background: linear-gradient(135deg, #fbbf24, #f97316);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  .result-sub { font-size: 15px; color: #94a3b8; margin-bottom: 25px; }

  @media (max-width: 600px) {
    .options-grid { grid-template-columns: 1fr; }
    .scene-card { padding: 22px 18px; }
    .english-word { font-size: 22px; }
    .result-score { font-size: 40px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <a href="../hub.html" class="back-btn">🏠 بازگشت</a>
    <div class="level-pill">A1 • Beginner</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span class="stage-label" id="stageLabel">مرحله ۱ از ۸</span>
      <span class="score-label" id="scoreLabel">امتیاز: ۰</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="sceneContainer"></div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   📚 A1 — دوره کامل با ۸ مرحله متنوع
   کلمات بر اساس Oxford 3000/5000 سطح A1
   ══════════════════════════════════════════════════════════════ */

const TOTAL_STAGES = 8;
let currentStage = 0;
let score = 0;

/* ═══ داده‌های مراحل ═══ */
const stages = [
  /* ─── مرحله ۱: واژگان — تصویر به کلمه ─── */
  {
    type: 'multiple-choice',
    icon: '🎮',
    title: 'مرحله ۱: واژگان تصویری',
    subtitle: 'کلمه درست را برای هر تصویر انتخاب کن',
    questions: [
      { prompt: '🍎 این چیست؟', options: ['apple', 'orange', 'banana', 'grape'], answer: 'apple' },
      { prompt: '🐕 این چیست؟', options: ['cat', 'dog', 'bird', 'fish'], answer: 'dog' },
      { prompt: '🏠 این چیست؟', options: ['school', 'hospital', 'house', 'shop'], answer: 'house' },
      { prompt: '🚗 این چیست؟', options: ['bus', 'car', 'train', 'plane'], answer: 'car' },
      { prompt: '📖 این چیست؟', options: ['pen', 'book', 'bag', 'desk'], answer: 'book' }
    ]
  },

  /* ─── مرحله ۲: شنیداری — گوش کن و انتخاب کن ─── */
  {
    type: 'listening',
    icon: '🎧',
    title: 'مرحله ۲: شنیداری',
    subtitle: 'به کلمه گوش کن و ترجمه درست را انتخاب کن',
    questions: [
      { word: 'water', options: ['آب', 'نان', 'شیر', 'چای'], answer: 'آب' },
      { word: 'friend', options: ['دشمن', 'دوست', 'برادر', 'خواهر'], answer: 'دوست' },
      { word: 'school', options: ['خانه', 'مدرسه', 'بیمارستان', 'فروشگاه'], answer: 'مدرسه' },
      { word: 'happy', options: ['غمگین', 'خسته', 'خوشحال', 'عصبانی'], answer: 'خوشحال' },
      { word: 'family', options: ['خانواده', 'همکار', 'همسایه', 'معلم'], answer: 'خانواده' }
    ]
  },

  /* ─── مرحله ۳: خواندن — درک مطلب ─── */
  {
    type: 'reading',
    icon: '📚',
    title: 'مرحله ۳: خواندن',
    subtitle: 'متن کوتاه را بخوان و به سوال پاسخ بده',
    passages: [
      {
        text: 'My name is Sara. I am ten years old. I have one brother and one sister. We live in a small house near the park. I like to play with my dog every day.',
        question: 'How old is Sara?',
        options: ['Ten years old', 'Twelve years old', 'Eight years old', 'Five years old'],
        answer: 'Ten years old'
      },
      {
        text: 'Tom is a student. He goes to school every morning. He likes English and math. After school, he plays football with his friends.',
        question: 'What does Tom like?',
        options: ['English and math', 'Art and music', 'Science and history', 'Only football'],
        answer: 'English and math'
      },
      {
        text: 'The weather is sunny today. Mary and her mother go to the market. They buy apples, bread, and milk. Then they go home and make a cake.',
        question: 'What do they buy?',
        options: ['Apples, bread, and milk', 'Oranges, rice, and tea', 'Eggs, cheese, and juice', 'Bananas, meat, and water'],
        answer: 'Apples, bread, and milk'
      }
    ]
  },

  /* ─── مرحله ۴: نوشتن — تایپ کلمه ─── */
  {
    type: 'writing',
    icon: '✍️',
    title: 'مرحله ۴: نوشتن',
    subtitle: 'کلمه انگلیسی را برای هر معنی تایپ کن',
    questions: [
      { prompt: 'آب', answer: 'water', hint: 'w _ _ _ _' },
      { prompt: 'کتاب', answer: 'book', hint: 'b _ _ _' },
      { prompt: 'خانه', answer: 'house', hint: 'h _ _ _ _' },
      { prompt: 'دوست', answer: 'friend', hint: 'f _ _ _ _ _' },
      { prompt: 'خوشحال', answer: 'happy', hint: 'h _ _ _ _' }
    ]
  },

  /* ─── مرحله ۵: مکالمه — تلفظ با میکروفون ─── */
  {
    type: 'speaking',
    icon: '🎤',
    title: 'مرحله ۵: مکالمه',
    subtitle: 'کلمه را بلند تلفظ کن (بدون میکروفون هم می‌توانی رد کنی)',
    questions: [
      { word: 'hello', translation: 'سلام' },
      { word: 'goodbye', translation: 'خداحافظ' },
      { word: 'thank you', translation: 'ممنون' },
      { word: 'please', translation: 'لطفاً' },
      { word: 'sorry', translation: 'ببخشید' }
    ]
  },

  /* ─── مرحله ۶: جملات — ترتیب کلمات ─── */
  {
    type: 'sentence',
    icon: '🧩',
    title: 'مرحله ۶: جمله‌سازی',
    subtitle: 'کلمات را به ترتیب درست بچین تا جمله کامل شود',
    questions: [
      { words: ['I', 'am', 'a', 'student'], answer: 'I am a student', translation: 'من یک دانش‌آموز هستم' },
      { words: ['She', 'likes', 'apples'], answer: 'She likes apples', translation: 'او سیب دوست دارد' },
      { words: ['We', 'go', 'to', 'school'], answer: 'We go to school', translation: 'ما به مدرسه می‌رویم' },
      { words: ['He', 'is', 'my', 'friend'], answer: 'He is my friend', translation: 'او دوست من است' },
      { words: ['They', 'are', 'happy'], answer: 'They are happy', translation: 'آنها خوشحال هستند' }
    ]
  },

  /* ─── مرحله ۷: شنیداری پیشرفته — جمله ─── */
  {
    type: 'listening-sentence',
    icon: '🔊',
    title: 'مرحله ۷: شنیداری جمله',
    subtitle: 'جمله را گوش کن و ترجمه درست را انتخاب کن',
    questions: [
      { sentence: 'I have a red car.', options: ['من یک ماشین قرمز دارم', 'من یک ماشین آبی دارم', 'من یک دوچرخه قرمز دارم', 'من یک خانه قرمز دارم'], answer: 'من یک ماشین قرمز دارم' },
      { sentence: 'She is reading a book.', options: ['او در حال خواندن کتاب است', 'او در حال نوشتن کتاب است', 'او کتاب می‌خرد', 'او کتاب را دوست دارد'], answer: 'او در حال خواندن کتاب است' },
      { sentence: 'We live in a big city.', options: ['ما در یک شهر بزرگ زندگی می‌کنیم', 'ما در یک روستا زندگی می‌کنیم', 'ما به شهر بزرگ می‌رویم', 'ما شهر بزرگ را دوست داریم'], answer: 'ما در یک شهر بزرگ زندگی می‌کنیم' },
      { sentence: 'He wants to drink water.', options: ['او می‌خواهد آب بنوشد', 'او می‌خواهد غذا بخورد', 'او آب را دوست ندارد', 'او آب می‌خرد'], answer: 'او می‌خواهد آب بنوشد' }
    ]
  },

  /* ─── مرحله ۸: آزمون جامع ─── */
  {
    type: 'mixed',
    icon: '🏆',
    title: 'مرحله ۸: آزمون جامع',
    subtitle: 'ترکیبی از همه مهارت‌ها — خودت را محک بزن!',
    questions: [
      { type: 'mc', prompt: 'کدام کلمه به معنی «مدرسه» است؟', options: ['school', 'house', 'park', 'shop'], answer: 'school' },
      { type: 'mc', prompt: 'کدام کلمه به معنی «خوشحال» است؟', options: ['sad', 'happy', 'angry', 'tired'], answer: 'happy' },
      { type: 'write', prompt: 'کلمه انگلیسی «سیب» را بنویس:', answer: 'apple', hint: 'a _ _ _ _' },
      { type: 'mc', prompt: '«I ___ a student.» کدام گزینه درست است؟', options: ['am', 'is', 'are', 'be'], answer: 'am' },
      { type: 'write', prompt: 'کلمه انگلیسی «دوست» را بنویس:', answer: 'friend', hint: 'f _ _ _ _ _' },
      { type: 'mc', prompt: '«She ___ apples.» کدام گزینه درست است؟', options: ['like', 'likes', 'liking', 'liked'], answer: 'likes' }
    ]
  }
];

/* ═══ راه‌اندازی ═══ */
function init() {
  currentStage = 0;
  score = 0;
  renderStage();
}

/* ═══ به‌روزرسانی نوار پیشرفت ═══ */
function updateProgress() {
  document.getElementById('stageLabel').textContent =
    `مرحله ${currentStage + 1} از ${TOTAL_STAGES}`;
  document.getElementById('scoreLabel').textContent = `امتیاز: ${score}`;
  const pct = ((currentStage) / TOTAL_STAGES) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ═══ رندر مرحله ═══ */
function renderStage() {
  updateProgress();
  const container = document.getElementById('sceneContainer');
  const stage = stages[currentStage];

  if (!stage) {
    renderResult();
    return;
  }

  const header = `
    <div class="scene-header">
      <span class="scene-icon">${stage.icon}</span>
      <div class="scene-titles">
        <h3>${stage.title}</h3>
        <p>${stage.subtitle}</p>
      </div>
    </div>
  `;

  let body = '';

  switch (stage.type) {
    case 'multiple-choice':
      body = renderMultipleChoice(stage.questions);
      break;
    case 'listening':
      body = renderListening(stage.questions);
      break;
    case 'reading':
      body = renderReading(stage.passages);
      break;
    case 'writing':
      body = renderWriting(stage.questions);
      break;
    case 'speaking':
      body = renderSpeaking(stage.questions);
      break;
    case 'sentence':
      body = renderSentence(stage.questions);
      break;
    case 'listening-sentence':
      body = renderListeningSentence(stage.questions);
      break;
    case 'mixed':
      body = renderMixed(stage.questions);
      break;
  }

  container.innerHTML = `<div class="scene-card">${header}${body}</div>`;
}

/* ═══ مرحله چندگزینه‌ای ═══ */
function renderMultipleChoice(questions) {
  let html = `<div id="mcWrap">`;
  questions.forEach((q, i) => {
    html += `
      <div style="margin-bottom:22px;" data-q="${i}">
        <div class="question-text">${q.prompt}</div>
        <div class="options-grid">
          ${q.options.map(opt => `
            <button class="option-btn" onclick="checkMC(this, '${opt.replace(/'/g, "\\'")}', '${q.answer.replace(/'/g, "\\'")}', ${i})">
              ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button>
    </div>
  </div>`;
  return html;
}

let mcAnswered = {};
function checkMC(btn, selected, answer, qIndex) {
  if (mcAnswered[qIndex]) return;
  mcAnswered[qIndex] = true;

  const parent = btn.closest('.options-grid');
  parent.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

  if (selected === answer) {
    btn.classList.add('correct');
    score += 10;
  } else {
    btn.classList.add('wrong');
    parent.querySelectorAll('.option-btn').forEach(b => {
      if (b.textContent.trim() === answer) b.classList.add('correct');
    });
  }
  updateProgress();
}

/* ═══ مرحله شنیداری ═══ */
function renderListening(questions) {
  let html = `<div id="listenWrap">`;
  questions.forEach((q, i) => {
    html += `
      <div style="margin-bottom:22px;" data-q="${i}">
        <button class="btn btn-secondary" style="width:100%;justify-content:center;"
          onclick="playWord('${q.word}')">
          🔊 پخش کلمه ${i + 1}
        </button>
        <div class="options-grid" style="margin-top:12px;">
          ${q.options.map(opt => `
            <button class="option-btn" onclick="checkMC(this, '${opt}', '${q.answer}', 'L${i}')">
              ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button>
    </div>
  </div>`;
  return html;
}

/* ═══ مرحله خواندن ═══ */
function renderReading(passages) {
  let html = `<div id="readWrap">`;
  passages.forEach((p, i) => {
    html += `
      <div style="margin-bottom:26px;padding:18px;background:rgba(15,23,42,0.5);border-radius:14px;">
        <p style="font-size:14px;line-height:1.8;color:#cbd5e1;margin-bottom:14px;direction:ltr;text-align:left;">${p.text}</p>
        <div class="question-text">${p.question}</div>
        <div class="options-grid">
          ${p.options.map(opt => `
            <button class="option-btn" onclick="checkMC(this, '${opt.replace(/'/g, "\\'")}', '${p.answer.replace(/'/g, "\\'")}', 'R${i}')">
              ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button>
    </div>
  </div>`;
  return html;
}

/* ═══ مرحله نوشتن ═══ */
function renderWriting(questions) {
  let html = `<div id="writeWrap">`;
  questions.forEach((q, i) => {
    html += `
      <div style="margin-bottom:20px;" data-q="${i}">
        <div class="question-text">«${q.prompt}» را به انگلیسی بنویس:</div>
        <div class="question-hint">راهنما: ${q.hint}</div>
        <input type="text" class="text-input" id="writeInput${i}" placeholder="Type here..." dir="ltr"
          onkeydown="if(event.key==='Enter')checkWrite(${i}, '${q.answer}')">
        <button class="btn btn-secondary" style="margin-top:10px;" onclick="checkWrite(${i}, '${q.answer}')">بررسی</button>
        <div class="feedback" id="writeFb${i}"></div>
      </div>
    `;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button>
    </div>
  </div>`;
  return html;
}

function checkWrite(i, answer) {
  const input = document.getElementById('writeInput' + i);
  const fb = document.getElementById('writeFb' + i);
  const val = input.value.trim().toLowerCase();
  if (!val) return;

  if (val === answer.toLowerCase()) {
    input.classList.add('correct');
    fb.className = 'feedback success show';
    fb.textContent = '✅ عالی! درست است.';
    score += 10;
  } else {
    input.classList.add('wrong');
    fb.className = 'feedback error show';
    fb.textContent = `❌ اشتباه. پاسخ درست: ${answer}`;
  }
  input.disabled = true;
  updateProgress();
}

/* ═══ مرحله مکالمه ═══ */
function renderSpeaking(questions) {
  let html = `<div id="speakWrap">`;
  questions.forEach((q, i) => {
    html += `
      <div style="margin-bottom:22px;padding:18px;background:rgba(15,23,42,0.5);border-radius:14px;">
        <div class="english-word">${q.word}</div>
        <p style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:14px;">ترجمه: ${q.translation}</p>
        <div class="mic-area">
          <button class="mic-btn" id="micBtn${i}" onclick="toggleMic(${i})">🎤</button>
          <div class="mic-status" id="micStatus${i}">برای ضبط کلیک کن</div>
        </div>
        <div style="text-align:center;margin-top:12px;">
          <button class="btn btn-secondary" onclick="skipSpeak(${i})">رد کردن (بدون ضبط)</button>
        </div>
      </div>
    `;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button>
    </div>
  </div>`;
  return html;
}

let mediaRecorder = null;
let recordingIdx = null;
function toggleMic(i) {
  const btn = document.getElementById('micBtn' + i);
  const status = document.getElementById('micStatus' + i);

  if (recordingIdx === i && mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    btn.classList.remove('recording');
    status.textContent = '✅ ضبط شد';
    score += 5;
    updateProgress();
    recordingIdx = null;
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = '⚠️ مرورگر از میکروفون پشتیبانی نمی‌کند';
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.start();
    recordingIdx = i;
    btn.classList.add('recording');
    status.textContent = '🔴 در حال ضبط... برای توقف کلیک کن';
  }).catch(() => {
    status.textContent = '⚠️ دسترسی به میکروفون داده نشد';
  });
}

function skipSpeak(i) {
  document.getElementById('micStatus' + i).textContent = '⏭ رد شد';
  document.getElementById('micBtn' + i).disabled = true;
}

/* ═══ مرحله جمله‌سازی ═══ */
function renderSentence(questions) {
  let html = `<div id="sentWrap">`;
  questions.forEach((q, i) => {
    const shuffled = [...q.words].sort(() => Math.random() - 0.5);
    html += `
      <div style="margin-bottom:22px;padding:18px;background:rgba(15,23,42,0.5);border-radius:14px;" data-q="${i}">
        <div class="question-text">${q.translation}</div>
        <div class="question-hint">کلمات را به ترتیب درست بچین:</div>
        <div id="wordBank${i}" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
          ${shuffled.map((w, wi) => `
            <button class="option-btn" style="padding:10px 16px;font-size:14px;"
              onclick="pickWord(${i}, this, '${w.replace(/'/g, "\\'")}')">${w}</button>
          `).join('')}
        </div>
        <div id="builtSentence${i}" style="min-height:40px;padding:12px;background:rgba(56,189,248,0.08);border:2px dashed rgba(56,189,248,0.3);border-radius:10px;color:#38bdf8;font-weight:700;direction:ltr;text-align:left;font-family:'Courier New',monospace;"></div>
        <div class="feedback" id="sentFb${i}"></div>
        <div style="margin-top:10px;">
          <button class="btn btn-secondary" onclick="checkSentence(${i}, '${q.answer}')">بررسی</button>
        </div>
      </div>
    `;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button>
    </div>
  </div>`;
  return html;
}

let builtWords = {};
function pickWord(qIndex, btn, word) {
  if (!builtWords[qIndex]) builtWords[qIndex] = [];
  builtWords[qIndex].push(word);
  btn.disabled = true;
  btn.style.opacity = '0.3';
  document.getElementById('builtSentence' + qIndex).textContent =
    builtWords[qIndex].join(' ');
}

function checkSentence(qIndex, answer) {
  const fb = document.getElementById('sentFb' + qIndex);
  const built = (builtWords[qIndex] || []).join(' ');
  if (built === answer) {
    fb.className = 'feedback success show';
    fb.textContent = '✅ عالی! جمله درست است.';
    score += 10;
  } else {
    fb.className = 'feedback error show';
    fb.textContent = `❌ جمله درست: ${answer}`;
  }
  updateProgress();
}

/* ═══ مرحله شنیداری جمله ═══ */
function renderListeningSentence(questions) {
  let html = `<div id="lsWrap">`;
  questions.forEach((q, i) => {
    html += `
      <div style="margin-bottom:22px;" data-q="${i}">
        <button class="btn btn-secondary" style="width:100%;justify-content:center;"
          onclick="speakSentence('${q.sentence}')">
          🔊 پخش جمله ${i + 1}
        </button>
        <div class="options-grid" style="margin-top:12px;">
          ${q.options.map(opt => `
            <button class="option-btn" onclick="checkMC(this, '${opt}', '${q.answer}', 'LS${i}')">
              ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button>
    </div>
  </div>`;
  return html;
}

/* ═══ مرحله ترکیبی ═══ */
function renderMixed(questions) {
  let html = `<div id="mixedWrap">`;
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px;padding:16px;background:rgba(15,23,42,0.5);border-radius:14px;" data-q="${i}">`;
    if (q.type === 'mc') {
      html += `
        <div class="question-text">${q.prompt}</div>
        <div class="options-grid">
          ${q.options.map(opt => `
            <button class="option-btn" onclick="checkMC(this, '${opt}', '${q.answer}', 'M${i}')">${opt}</button>
          `).join('')}
        </div>
      `;
    } else if (q.type === 'write') {
      html += `
        <div class="question-text">${q.prompt}</div>
        <div class="question-hint">راهنما: ${q.hint}</div>
        <input type="text" class="text-input" id="mxInput${i}" placeholder="Type here..." dir="ltr"
          onkeydown="if(event.key==='Enter')checkMixedWrite(${i}, '${q.answer}')">
        <button class="btn btn-secondary" style="margin-top:10px;" onclick="checkMixedWrite(${i}, '${q.answer}')">بررسی</button>
        <div class="feedback" id="mxFb${i}"></div>
      `;
    }
    html += `</div>`;
  });
  html += `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nextStage()">پایان و مشاهده نتیجه 🏁</button>
    </div>
  </div>`;
  return html;
}

function checkMixedWrite(i, answer) {
  const input = document.getElementById('mxInput' + i);
  const fb = document.getElementById('mxFb' + i);
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  if (val === answer.toLowerCase()) {
    input.classList.add('correct');
    fb.className = 'feedback success show';
    fb.textContent = '✅ درست!';
    score += 10;
  } else {
    input.classList.add('wrong');
    fb.className = 'feedback error show';
    fb.textContent = `❌ پاسخ درست: ${answer}`;
  }
  input.disabled = true;
  updateProgress();
}

/* ═══ پخش صدا (TTS) ═══ */
function playWord(word) {
  if (!('speechSynthesis' in window)) { alert('مرورگر از TTS پشتیبانی نمی‌کند'); return; }
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function speakSentence(sentence) {
  if (!('speechSynthesis' in window)) { alert('مرورگر از TTS پشتیبانی نمی‌کند'); return; }
  const u = new SpeechSynthesisUtterance(sentence);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ═══ مرحله بعد ═══ */
function nextStage() {
  currentStage++;
  mcAnswered = {};
  builtWords = {};
  if (currentStage >= TOTAL_STAGES) {
    renderResult();
  } else {
    renderStage();
  }
}

/* ═══ نتیجه نهایی ═══ */
function renderResult() {
  const maxScore = 300;
  const pct = Math.round((score / maxScore) * 100);
  let emoji, title, msg;
  if (pct >= 80) { emoji = '🏆'; title = 'عالی!'; msg = 'تو یک قهرمان زبان هستی!'; }
  else if (pct >= 60) { emoji = '🎉'; title = 'خوب بود!'; msg = 'با کمی تمرین بهتر می‌شوی.'; }
  else if (pct >= 40) { emoji = '💪'; title = 'تلاش خوبی بود!'; msg = 'دوباره تلاش کن، می‌توانی!'; }
  else { emoji = '📚'; title = 'نیاز به تمرین بیشتر'; msg = 'نگران نباش، از اول شروع کن!'; }

  document.getElementById('sceneContainer').innerHTML = `
    <div class="scene-card">
      <div class="result-screen">
        <div class="result-emoji">${emoji}</div>
        <div class="result-title">${title}</div>
        <div class="result-score">${score} / ${maxScore}</div>
        <div class="result-sub">${msg}</div>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn btn-primary" onclick="restart()">🔄 دوباره</button>
          <a href="../hub.html" class="btn btn-secondary">🏠 بازگشت به منو</a>
        </div>
      </div>
    </div>
  `;
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('stageLabel').textContent = 'پایان دوره';
  document.getElementById('scoreLabel').textContent = `امتیاز نهایی: ${score}`;
}

function restart() {
  currentStage = 0;
  score = 0;
  mcAnswered = {};
  builtWords = {};
  renderStage();
}

/* ═══ شروع ═══ */
window.addEventListener('load', init);
</script>
