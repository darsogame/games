<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انگلیسی A2 - دوره کامل | Darsogame</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    color: #e2e8f0; padding: 25px 18px; }
  .container { max-width: 900px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .back-btn { display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; background: rgba(56,189,248,0.15);
    border: 2px solid rgba(56,189,248,0.3); border-radius: 12px;
    color: #38bdf8; text-decoration: none; font-weight: 900; font-size: 13px; transition: all 0.25s; }
  .back-btn:hover { background: rgba(56,189,248,0.3); transform: translateY(-2px); }
  .level-pill { padding: 8px 20px; background: linear-gradient(135deg, #22c55e, #38bdf8);
    border-radius: 20px; color: #0f172a; font-weight: 900; font-size: 14px;
    font-family: 'Courier New', monospace; }
  .progress-wrap { background: rgba(15,23,42,0.7); border: 2px solid rgba(56,189,248,0.25);
    border-radius: 18px; padding: 16px 20px; margin-bottom: 25px; }
  .progress-info { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 13px; font-weight: 900; }
  .progress-info .stage-label { color: #38bdf8; }
  .progress-info .score-label { color: #fbbf24; }
  .progress-bar { height: 12px; background: rgba(148,163,184,0.2);
    border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%;
    background: linear-gradient(90deg, #22c55e, #38bdf8, #fbbf24);
    border-radius: 10px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .scene-card { background: linear-gradient(135deg, #1e293b, #334155);
    border: 2px solid rgba(56,189,248,0.2); border-radius: 22px;
    padding: 28px 24px; margin-bottom: 22px; min-height: 300px; }
  .scene-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid rgba(148,163,184,0.15); }
  .scene-icon { font-size: 34px; }
  .scene-titles h3 { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 3px; }
  .scene-titles p { font-size: 12px; color: #94a3b8; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px; border-radius: 14px; font-family: inherit;
    font-size: 14px; font-weight: 900; cursor: pointer; border: none;
    transition: all 0.25s; outline: none; }
  .btn-primary { background: linear-gradient(135deg, #38bdf8, #a78bfa); color: #0f172a; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(56,189,248,0.4); }
  .btn-secondary { background: rgba(148,163,184,0.15); color: #cbd5e1;
    border: 2px solid rgba(148,163,184,0.3); }
  .btn-secondary:hover { background: rgba(148,163,184,0.25); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .option-btn { padding: 16px 18px; background: rgba(15,23,42,0.6);
    border: 2px solid rgba(148,163,184,0.25); border-radius: 14px;
    color: #e2e8f0; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; text-align: center; outline: none; }
  .option-btn:hover:not(:disabled) { border-color: #38bdf8; background: rgba(56,189,248,0.1);
    transform: translateY(-2px); }
  .option-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.2); color: #86efac; }
  .option-btn.wrong { border-color: #ef4444; background: rgba(239,68,68,0.2); color: #fca5a5; }
  .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
  .text-input { width: 100%; padding: 14px 18px; background: rgba(15,23,42,0.6);
    border: 2px solid rgba(148,163,184,0.25); border-radius: 14px;
    color: #fff; font-family: inherit; font-size: 16px; outline: none; transition: border-color 0.2s; }
  .text-input:focus { border-color: #38bdf8; }
  .text-input.correct { border-color: #22c55e; background: rgba(34,197,94,0.1); }
  .text-input.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }
  .question-text { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.7; margin-bottom: 6px; }
  .question-hint { font-size: 12px; color: #94a3b8; margin-bottom: 18px; }
  .english-word { font-size: 28px; font-weight: 900; color: #38bdf8;
    font-family: 'Courier New', monospace; direction: ltr;
    text-align: center; padding: 16px; margin: 10px 0;
    background: rgba(56,189,248,0.08); border-radius: 14px;
    border: 1px dashed rgba(56,189,248,0.3); }
  .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 14px;
    font-size: 14px; font-weight: 700; line-height: 1.6; display: none; }
  .feedback.show { display: block; }
  .feedback.success { background: rgba(34,197,94,0.15); border: 2px solid rgba(34,197,94,0.4); color: #86efac; }
  .feedback.error { background: rgba(239,68,68,0.15); border: 2px solid rgba(239,68,68,0.4); color: #fca5a5; }
  .mic-area { text-align: center; padding: 20px; }
  .mic-btn { width: 90px; height: 90px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ef4444, #f97316); color: #fff; font-size: 36px;
    cursor: pointer; transition: all 0.25s; box-shadow: 0 10px 25px rgba(239,68,68,0.4); }
  .mic-btn:hover { transform: scale(1.08); }
  .mic-btn.recording { animation: pulse 1s infinite; background: linear-gradient(135deg, #22c55e, #16a34a); }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.6);} 50%{box-shadow:0 0 0 20px rgba(34,197,94,0);} }
  .mic-status { font-size: 13px; color: #94a3b8; margin-top: 12px; font-weight: 700; }
  .result-screen { text-align: center; padding: 30px 20px; }
  .result-emoji { font-size: 80px; margin-bottom: 20px; }
  .result-title { font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 12px; }
  .result-score { font-size: 52px; font-weight: 900; font-family: 'Courier New', monospace;
    background: linear-gradient(135deg, #fbbf24, #f97316);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px; }
  .result-sub { font-size: 15px; color: #94a3b8; margin-bottom: 25px; }
  @media (max-width: 600px) {
    .options-grid { grid-template-columns: 1fr; }
    .scene-card { padding: 22px 18px; }
    .english-word { font-size: 22px; }
    .result-score { font-size: 40px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="../hub.html" class="back-btn">🏠 بازگشت</a>
    <div class="level-pill">A2 • Elementary</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info">
      <span class="stage-label" id="stageLabel">مرحله ۱ از ۸</span>
      <span class="score-label" id="scoreLabel">امتیاز: ۰</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div id="sceneContainer"></div>
</div>

<script>
/* ═══ A2 — دوره کامل با ۸ مرحله ═══ */
const TOTAL_STAGES = 8;
let currentStage = 0;
let score = 0;

const stages = [
  /* ─── ۱: واژگان ─── */
  {
    type: 'multiple-choice', icon: '🎮',
    title: 'مرحله ۱: واژگان روزمره',
    subtitle: 'کلمه درست را انتخاب کن',
    questions: [
      { prompt: '✈️ وسیله‌ای برای سفر هوایی:', options: ['train', 'bus', 'ship','plane'], answer: 'plane' },
      { prompt: '☀️ آب و هوای گرم و آفتابی:', options: ['rainy', 'snowy','sunny', 'windy'], answer: 'sunny' },
      { prompt: '🏥 جایی که بیماران درمان می‌شوند:', options: ['school', 'hospital', 'market', 'library'], answer: 'hospital' },
      { prompt: '🍽️ وعده غذایی صبح:', options: ['lunch', 'dinner', 'breakfast', 'snack'], answer: 'breakfast' },
      { prompt: '💰 پول دادن برای خرید:', options: ['pay', 'sell', 'borrow', 'lend'], answer: 'pay' }
    ]
  },

  /* ─── ۲: شنیداری ─── */
  {
    type: 'listening', icon: '🎧',
    title: 'مرحله ۲: شنیداری کلمات',
    subtitle: 'گوش کن و معنی درست را انتخاب کن',
    questions: [
      { word: 'weather', options: [, 'ساعت', 'ماشین','آب و هوا', 'کتاب'], answer: 'آب و هوا' },
      { word: 'holiday', options: ['تعطیلات', 'مدرسه', 'کار', 'بیمارستان'], answer: 'تعطیلات' },
      { word: 'restaurant', options: ['فروشگاه', 'بیمارستان', 'مدرسه','رستوران'], answer: 'رستوران' },
      { word: 'shopping', options: ['خرید', 'پختن', 'خواندن', 'نوشتن'], answer: 'خرید' },
      { word: 'doctor', options: ['دکتر', 'معلم', 'راننده', 'آشپز'], answer: 'دکتر' }
    ]
  },

  /* ─── ۳: خواندن ─── */
  {
    type: 'reading', icon: '📚',
    title: 'مرحله ۳: خواندن و درک مطلب',
    subtitle: 'متن را بخوان و پاسخ بده',
    passages: [
      {
        text: 'Last summer, Ali and his family traveled to the north of Iran. They stayed in a small hotel near the sea. Every morning, they went to the beach and swam in the water. In the evening, they ate delicious food at a local restaurant. Ali took many photos and bought a beautiful gift for his friend.',
        question: 'Where did Ali and his family travel?',
        options: ['To the south of Iran', 'To the east of Iran','To the north of Iran', 'To the west of Iran'],
        answer: 'To the north of Iran'
      },
      {
        text: 'Sara is a nurse at a big hospital in the city. She works five days a week, from 8 am to 4 pm. She helps doctors and takes care of patients. She loves her job because she likes helping people. After work, she usually goes to the gym and exercises for an hour.',
        question: 'What does Sara do after work?',
        options: [ 'She goes to the market','She goes to the gym', 'She goes to the park', 'She goes home and sleeps'],
        answer: 'She goes to the gym'
      },
      {
        text: 'The weather in London is often rainy and cloudy. People usually carry an umbrella when they go out. In summer, the weather is warmer and the days are longer. Many tourists visit London in summer to see famous places like Big Ben and the Tower Bridge.',
        question: 'Why do tourists visit London in summer?',
        options: ['To see famous places', 'To study English', 'To work in hotels', 'To meet the queen'],
        answer: 'To see famous places'
      }
    ]
  },

  /* ─── ۴: نوشتن ─── */
  {
    type: 'writing', icon: '✍️',
    title: 'مرحله ۴: نوشتن کلمات',
    subtitle: 'کلمه انگلیسی را تایپ کن',
    questions: [
      { prompt: 'سفر', answer: 'travel', hint: 't _ _ _ _ _' },
      { prompt: 'آب و هوا', answer: 'weather', hint: 'w _ _ _ _ _ _' },
      { prompt: 'تعطیلات', answer: 'holiday', hint: 'h _ _ _ _ _ _' },
      { prompt: 'رستوران', answer: 'restaurant', hint: 'r _ _ _ _ _ _ _ _ _' },
      { prompt: 'خرید کردن', answer: 'shopping', hint: 's _ _ _ _ _ _ _' }
    ]
  },

  /* ─── ۵: مکالمه ─── */
  {
    type: 'speaking', icon: '🎤',
    title: 'مرحله ۵: مکالمه',
    subtitle: 'جمله را تلفظ کن',
    questions: [
      { word: 'How are you?', translation: 'حالت چطور است؟' },
      { word: 'I would like a coffee', translation: 'من یک قهوه می‌خواهم' },
      { word: 'Where is the station?', translation: 'ایستگاه کجاست؟' },
      { word: 'How much does it cost?', translation: 'قیمت آن چقدر است؟' },
      { word: 'Can you help me?', translation: 'می‌توانی به من کمک کنی؟' }
    ]
  },

  /* ─── ۶: جمله‌سازی ─── */
  {
    type: 'sentence', icon: '🧩',
    title: 'مرحله ۶: جمله‌سازی',
    subtitle: 'کلمات را به ترتیب درست بچین',
    questions: [
      { words: ['I', 'went', 'to', 'the', 'beach'], answer: 'I went to the beach', translation: 'من به ساحل رفتم' },
      { words: ['She', 'is', 'reading', 'a', 'book'], answer: 'She is reading a book', translation: 'او در حال خواندن کتاب است' },
      { words: ['They', 'will', 'travel', 'next', 'week'], answer: 'They will travel next week', translation: 'آنها هفته آینده سفر خواهند کرد' },
      { words: ['We', 'had', 'a', 'good', 'time'], answer: 'We had a good time', translation: 'ما اوقات خوشی داشتیم' },
      { words: ['He', 'doesn\'t', 'like', 'coffee'], answer: 'He doesn\'t like coffee', translation: 'او قهوه دوست ندارد' }
    ]
  },

  /* ─── ۷: شنیداری جمله ─── */
  {
    type: 'listening-sentence', icon: '🔊',
    title: 'مرحله ۷: شنیداری جمله',
    subtitle: 'جمله را گوش کن و ترجمه را انتخاب کن',
    questions: [
      { sentence: 'I usually go to the gym after work.', options: ['من معمولاً بعد از کار به باشگاه می‌روم', 'من معمولاً قبل از کار به باشگاه می‌روم', 'من هرگز به باشگاه نمی‌روم', 'من در خانه ورزش می‌کنم'], answer: 'من معمولاً بعد از کار به باشگاه می‌روم' },
      { sentence: 'The restaurant is next to the bank.', options: ['رستوران کنار بانک است', 'رستوران روبه‌روی بانک است', 'رستوران پشت بانک است', 'رستوران داخل بانک است'], answer: 'رستوران کنار بانک است' },
      { sentence: 'She bought a gift for her friend.', options: ['او برای دوستش هدیه خرید', 'او از دوستش هدیه گرفت', 'او هدیه دوستش را گم کرد', 'او هدیه‌ای به دوستش داد'], answer: 'او برای دوستش هدیه خرید' },
      { sentence: 'We are planning a trip to the mountains.', options: ['ما در حال برنامه‌ریزی سفر به کوه هستیم', 'ما به کوه سفر کردیم', 'ما از کوه برگشتیم', 'ما در کوه زندگی می‌کنیم'], answer: 'ما در حال برنامه‌ریزی سفر به کوه هستیم' }
    ]
  },

  /* ─── ۸: آزمون جامع ─── */
  {
    type: 'mixed', icon: '🏆',
    title: 'مرحله ۸: آزمون جامع',
    subtitle: 'ترکیبی از همه مهارت‌ها',
    questions: [
      { type: 'mc', prompt: 'کدام کلمه به معنی «سفر» است؟', options: ['travel', 'weather', 'holiday', 'shopping'], answer: 'travel' },
      { type: 'mc', prompt: '«I ___ to the beach yesterday.»', options: ['go', 'went', 'going', 'goes'], answer: 'went' },
      { type: 'write', prompt: 'کلمه انگلیسی «تعطیلات» را بنویس:', answer: 'holiday', hint: 'h _ _ _ _ _ _' },
      { type: 'mc', prompt: 'کدام کلمه به معنی «رستوران» است؟', options: ['restaurant', 'hospital', 'school', 'market'], answer: 'restaurant' },
      { type: 'write', prompt: 'کلمه انگلیسی «دکتر» را بنویس:', answer: 'doctor', hint: 'd _ _ _ _ _' },
      { type: 'mc', prompt: '«She ___ a book now.»', options: ['reads', 'is reading', 'read', 'reading'], answer: 'is reading' }
    ]
  }
];

function init() { currentStage = 0; score = 0; renderStage(); }
function updateProgress() {
  document.getElementById('stageLabel').textContent = `مرحله ${currentStage + 1} از ${TOTAL_STAGES}`;
  document.getElementById('scoreLabel').textContent = `امتیاز: ${score}`;
  document.getElementById('progressFill').style.width = ((currentStage) / TOTAL_STAGES * 100) + '%';
}
function renderStage() {
  updateProgress();
  const container = document.getElementById('sceneContainer');
  const stage = stages[currentStage];
  if (!stage) { renderResult(); return; }
  const header = `<div class="scene-header"><span class="scene-icon">${stage.icon}</span>
    <div class="scene-titles"><h3>${stage.title}</h3><p>${stage.subtitle}</p></div></div>`;
  let body = '';
  switch (stage.type) {
    case 'multiple-choice': body = renderMultipleChoice(stage.questions); break;
    case 'listening': body = renderListening(stage.questions); break;
    case 'reading': body = renderReading(stage.passages); break;
    case 'writing': body = renderWriting(stage.questions); break;
    case 'speaking': body = renderSpeaking(stage.questions); break;
    case 'sentence': body = renderSentence(stage.questions); break;
    case 'listening-sentence': body = renderListeningSentence(stage.questions); break;
    case 'mixed': body = renderMixed(stage.questions); break;
  }
  container.innerHTML = `<div class="scene-card">${header}${body}</div>`;
}
function renderMultipleChoice(questions) {
  let html = `<div>`;
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px;" data-q="${i}">
      <div class="question-text">${q.prompt}</div>
      <div class="options-grid">
        ${q.options.map(opt => `<button class="option-btn" onclick="checkMC(this, '${opt.replace(/'/g, "\\'")}', '${q.answer.replace(/'/g, "\\'")}', ${i})">${opt}</button>`).join('')}
      </div></div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
  return html;
}
let mcAnswered = {};
function checkMC(btn, selected, answer, qIndex) {
  if (mcAnswered[qIndex]) return;
  mcAnswered[qIndex] = true;
  const parent = btn.closest('.options-grid');
  parent.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  if (selected === answer) { btn.classList.add('correct'); score += 10; }
  else {
    btn.classList.add('wrong');
    parent.querySelectorAll('.option-btn').forEach(b => { if (b.textContent.trim() === answer) b.classList.add('correct'); });
  }
  updateProgress();
}
function renderListening(questions) {
  let html = `<div>`;
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px;" data-q="${i}">
      <button class="btn btn-secondary" style="width:100%;justify-content:center;" onclick="playWord('${q.word}')">🔊 پخش کلمه ${i + 1}</button>
      <div class="options-grid" style="margin-top:12px;">
        ${q.options.map(opt => `<button class="option-btn" onclick="checkMC(this, '${opt}', '${q.answer}', 'L${i}')">${opt}</button>`).join('')}
      </div></div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
  return html;
}
function renderReading(passages) {
  let html = `<div>`;
  passages.forEach((p, i) => {
    html += `<div style="margin-bottom:26px;padding:18px;background:rgba(15,23,42,0.5);border-radius:14px;">
      <p style="font-size:14px;line-height:1.8;color:#cbd5e1;margin-bottom:14px;direction:ltr;text-align:left;">${p.text}</p>
      <div class="question-text">${p.question}</div>
      <div class="options-grid">
        ${p.options.map(opt => `<button class="option-btn" onclick="checkMC(this, '${opt.replace(/'/g, "\\'")}', '${p.answer.replace(/'/g, "\\'")}', 'R${i}')">${opt}</button>`).join('')}
      </div></div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
  return html;
}
function renderWriting(questions) {
  let html = `<div>`;
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:20px;" data-q="${i}">
      <div class="question-text">«${q.prompt}» را به انگلیسی بنویس:</div>
      <div class="question-hint">راهنما: ${q.hint}</div>
      <input type="text" class="text-input" id="writeInput${i}" placeholder="Type here..." dir="ltr" onkeydown="if(event.key==='Enter')checkWrite(${i}, '${q.answer}')">
      <button class="btn btn-secondary" style="margin-top:10px;" onclick="checkWrite(${i}, '${q.answer}')">بررسی</button>
      <div class="feedback" id="writeFb${i}"></div></div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
  return html;
}
function checkWrite(i, answer) {
  const input = document.getElementById('writeInput' + i);
  const fb = document.getElementById('writeFb' + i);
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  if (val === answer.toLowerCase()) {
    input.classList.add('correct'); fb.className = 'feedback success show'; fb.textContent = '✅ عالی! درست است.'; score += 10;
  } else {
    input.classList.add('wrong'); fb.className = 'feedback error show'; fb.textContent = `❌ اشتباه. پاسخ درست: ${answer}`;
  }
  input.disabled = true; updateProgress();
}
function renderSpeaking(questions) {
  let html = `<div>`;
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px;padding:18px;background:rgba(15,23,42,0.5);border-radius:14px;">
      <div class="english-word">${q.word}</div>
      <p style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:14px;">ترجمه: ${q.translation}</p>
      <div class="mic-area">
        <button class="mic-btn" id="micBtn${i}" onclick="toggleMic(${i})">🎤</button>
        <div class="mic-status" id="micStatus${i}">برای ضبط کلیک کن</div>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button class="btn btn-secondary" onclick="skipSpeak(${i})">رد کردن</button>
      </div></div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
  return html;
}
let mediaRecorder = null; let recordingIdx = null;
function toggleMic(i) {
  const btn = document.getElementById('micBtn' + i);
  const status = document.getElementById('micStatus' + i);
  if (recordingIdx === i && mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop(); btn.classList.remove('recording');
    status.textContent = '✅ ضبط شد'; score += 5; updateProgress(); recordingIdx = null; return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = '⚠️ مرورگر پشتیبانی نمی‌کند'; return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream); mediaRecorder.start();
    recordingIdx = i; btn.classList.add('recording');
    status.textContent = '🔴 در حال ضبط... برای توقف کلیک کن';
  }).catch(() => { status.textContent = '⚠️ دسترسی به میکروفون داده نشد'; });
}
function skipSpeak(i) {
  document.getElementById('micStatus' + i).textContent = '⏭ رد شد';
  document.getElementById('micBtn' + i).disabled = true;
}
function renderSentence(questions) {
  let html = `<div>`;
  questions.forEach((q, i) => {
    const shuffled = [...q.words].sort(() => Math.random() - 0.5);
    html += `<div style="margin-bottom:22px;padding:18px;background:rgba(15,23,42,0.5);border-radius:14px;" data-q="${i}">
      <div class="question-text">${q.translation}</div>
      <div class="question-hint">کلمات را به ترتیب درست بچین:</div>
      <div id="wordBank${i}" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        ${shuffled.map(w => `<button class="option-btn" style="padding:10px 16px;font-size:14px;" onclick="pickWord(${i}, this, '${w.replace(/'/g, "\\'")}')">${w}</button>`).join('')}
      </div>
      <div id="builtSentence${i}" style="min-height:40px;padding:12px;background:rgba(56,189,248,0.08);border:2px dashed rgba(56,189,248,0.3);border-radius:10px;color:#38bdf8;font-weight:700;direction:ltr;text-align:left;font-family:'Courier New',monospace;"></div>
      <div class="feedback" id="sentFb${i}"></div>
      <div style="margin-top:10px;"><button class="btn btn-secondary" onclick="checkSentence(${i}, '${q.answer.replace(/'/g, "\\'")}')">بررسی</button></div></div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
  return html;
}
let builtWords = {};
function pickWord(qIndex, btn, word) {
  if (!builtWords[qIndex]) builtWords[qIndex] = [];
  builtWords[qIndex].push(word); btn.disabled = true; btn.style.opacity = '0.3';
  document.getElementById('builtSentence' + qIndex).textContent = builtWords[qIndex].join(' ');
}
function checkSentence(qIndex, answer) {
  const fb = document.getElementById('sentFb' + qIndex);
  const built = (builtWords[qIndex] || []).join(' ');
  if (built === answer) { fb.className = 'feedback success show'; fb.textContent = '✅ عالی!'; score += 10; }
  else { fb.className = 'feedback error show'; fb.textContent = `❌ جمله درست: ${answer}`; }
  updateProgress();
}
function renderListeningSentence(questions) {
  let html = `<div>`;
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px;" data-q="${i}">
      <button class="btn btn-secondary" style="width:100%;justify-content:center;" onclick="speakSentence('${q.sentence.replace(/'/g, "\\'")}')">🔊 پخش جمله ${i + 1}</button>
      <div class="options-grid" style="margin-top:12px;">
        ${q.options.map(opt => `<button class="option-btn" onclick="checkMC(this, '${opt.replace(/'/g, "\\'")}', '${q.answer.replace(/'/g, "\\'")}', 'LS${i}')">${opt}</button>`).join('')}
      </div></div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
  return html;
}
function renderMixed(questions) {
  let html = `<div>`;
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px;padding:16px;background:rgba(15,23,42,0.5);border-radius:14px;" data-q="${i}">`;
    if (q.type === 'mc') {
      html += `<div class="question-text">${q.prompt}</div><div class="options-grid">
        ${q.options.map(opt => `<button class="option-btn" onclick="checkMC(this, '${opt.replace(/'/g, "\\'")}', '${q.answer.replace(/'/g, "\\'")}', 'M${i}')">${opt}</button>`).join('')}
      </div>`;
    } else {
      html += `<div class="question-text">${q.prompt}</div>
        <div class="question-hint">راهنما: ${q.hint}</div>
        <input type="text" class="text-input" id="mxInput${i}" placeholder="Type here..." dir="ltr" onkeydown="if(event.key==='Enter')checkMixedWrite(${i}, '${q.answer}')">
        <button class="btn btn-secondary" style="margin-top:10px;" onclick="checkMixedWrite(${i}, '${q.answer}')">بررسی</button>
        <div class="feedback" id="mxFb${i}"></div>`;
    }
    html += `</div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">پایان و مشاهده نتیجه 🏁</button></div></div>`;
  return html;
}
function checkMixedWrite(i, answer) {
  const input = document.getElementById('mxInput' + i);
  const fb = document.getElementById('mxFb' + i);
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  if (val === answer.toLowerCase()) { input.classList.add('correct'); fb.className = 'feedback success show'; fb.textContent = '✅ درست!'; score += 10; }
  else { input.classList.add('wrong'); fb.className = 'feedback error show'; fb.textContent = `❌ پاسخ درست: ${answer}`; }
  input.disabled = true; updateProgress();
}
function playWord(word) {
  if (!('speechSynthesis' in window)) { alert('مرورگر از TTS پشتیبانی نمی‌کند'); return; }
  const u = new SpeechSynthesisUtterance(word); u.lang = 'en-US'; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function speakSentence(sentence) {
  if (!('speechSynthesis' in window)) { alert('مرورگر از TTS پشتیبانی نمی‌کند'); return; }
  const u = new SpeechSynthesisUtterance(sentence); u.lang = 'en-US'; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function nextStage() {
  currentStage++; mcAnswered = {}; builtWords = {};
  if (currentStage >= TOTAL_STAGES) renderResult(); else renderStage();
}
function renderResult() {
  const maxScore = 300; const pct = Math.round((score / maxScore) * 100);
  let emoji, title, msg;
  if (pct >= 80) { emoji = '🏆'; title = 'عالی!'; msg = 'تو یک قهرمان زبان هستی!'; }
  else if (pct >= 60) { emoji = '🎉'; title = 'خوب بود!'; msg = 'با کمی تمرین بهتر می‌شوی.'; }
  else if (pct >= 40) { emoji = '💪'; title = 'تلاش خوبی بود!'; msg = 'دوباره تلاش کن، می‌توانی!'; }
  else { emoji = '📚'; title = 'نیاز به تمرین بیشتر'; msg = 'نگران نباش، از اول شروع کن!'; }
  document.getElementById('sceneContainer').innerHTML = `<div class="scene-card"><div class="result-screen">
    <div class="result-emoji">${emoji}</div><div class="result-title">${title}</div>
    <div class="result-score">${score} / ${maxScore}</div>
    <div class="result-sub">${msg}</div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-primary" onclick="restart()">🔄 دوباره</button>
      <a href="../hub.html" class="btn btn-secondary">🏠 بازگشت به منو</a>
    </div></div></div>`;
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('stageLabel').textContent = 'پایان دوره';
  document.getElementById('scoreLabel').textContent = `امتیاز نهایی: ${score}`;
}
function restart() { currentStage = 0; score = 0; mcAnswered = {}; builtWords = {}; renderStage(); }
window.addEventListener('load', init);
</script>
</body>
</html>
