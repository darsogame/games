<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="description" content="کتاب‌های Darsogame — کتاب‌های آموزشی و داستانی برای یادگیری زبان.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کتاب | Darsogame</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b 50%,#334155);color:#e2e8f0;padding:25px 18px}
.container{max-width:1000px;margin:auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(236,72,153,.15);border:2px solid rgba(236,72,153,.3);border-radius:12px;color:#ec4899;text-decoration:none;font-weight:900;font-size:13px}
.page-pill{padding:8px 20px;background:linear-gradient(135deg,#ec4899,#f97316);border-radius:20px;color:#fff;font-weight:900;font-size:14px}
.page-header{text-align:center;margin-bottom:30px;padding:30px 20px;background:linear-gradient(135deg,rgba(236,72,153,.12),rgba(249,115,22,.12));border-radius:25px;border:2px solid rgba(236,72,153,.25)}
.page-header h1{font-size:32px;font-weight:900;background:linear-gradient(135deg,#ec4899,#f97316,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.page-header p{color:#94a3b8;font-size:14px;line-height:1.7}
.filter-tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}
.filter-tab{padding:10px 18px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;border:2px solid rgba(148,163,184,.25);background:rgba(15,23,42,.6);color:#cbd5e1}
.filter-tab.active{background:linear-gradient(135deg,#ec4899,#f97316);color:#fff;border-color:transparent}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.book-card{background:linear-gradient(135deg,#1e293b,#334155);border:3px solid transparent;border-radius:22px;overflow:hidden;transition:.3s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.book-card:hover{transform:translateY(-7px);box-shadow:0 25px 55px rgba(0,0,0,.5);border-color:#ec4899}
.book-cover{height:210px;position:relative;background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(249,115,22,.15));display:flex;align-items:center;justify-content:center;overflow:hidden}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover .fallback{font-size:70px}
.book-format{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:8px;background:rgba(15,23,42,.85);color:#fff;font-size:10px;font-weight:900}
.book-body{padding:20px;display:flex;flex-direction:column;flex:1}
.book-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.book-tag,.book-level{padding:4px 10px;border-radius:8px;font-size:10px;font-weight:900}
.book-tag{background:rgba(236,72,153,.15);color:#ec4899}
.book-level{background:rgba(251,191,36,.15);color:#fbbf24}
.book-title{font-size:17px;font-weight:900;color:#fff;line-height:1.5;margin-bottom:8px}
.book-author{font-size:12px;color:#94a3b8;margin-bottom:10px}
.book-desc{font-size:13px;color:#94a3b8;line-height:1.7;margin-bottom:14px;flex:1}
.book-footer{display:flex;justify-content:space-between;gap:8px;align-items:center;padding-top:12px;border-top:1px solid rgba(148,163,184,.15);font-size:11px;color:#94a3b8;font-weight:700}
.open-btn{display:block;margin-top:12px;text-align:center;padding:10px;border-radius:10px;background:linear-gradient(135deg,#ec4899,#f97316);color:#fff;font-size:12px;font-weight:900}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-state .emoji{font-size:60px;margin-bottom:15px}
@media(max-width:600px){body{padding:15px 10px}.page-header h1{font-size:24px}.books-grid{grid-template-columns:1fr}.book-cover{height:190px}}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="hub.html" class="back-btn">🏠 بازگشت</a>
    <div class="page-pill">📕 کتاب</div>
  </div>

  <div class="page-header">
    <h1>📕 کتابخانه Darsogame</h1>
    <p>کتاب‌ها را مستقیماً در آرایه پایین کد اضافه یا ویرایش کنید.</p>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">همه</button>
    <button class="filter-tab" data-filter="story">📖 داستان</button>
    <button class="filter-tab" data-filter="grammar">📚 گرامر</button>
    <button class="filter-tab" data-filter="vocab">🔤 واژگان</button>
    <button class="filter-tab" data-filter="culture">🌍 فرهنگ</button>
    <button class="filter-tab" data-filter="other">📚 سایر</button>
  </div>

  <div class="books-grid" id="booksGrid"></div>
</div>

<script>
/* =========================================================
   فقط همین بخش را برای اضافه کردن کتاب ویرایش کنید.
   cover = لینک عکس
   link  = لینک PDF / EPUB / DOCX / ZIP / ...
   category = story | grammar | vocab | culture | other
   ========================================================= */

const books = [
  

  // کتاب‌های بعدی را با همین ساختار اضافه کنید.
];

let currentFilter = "all";

const categoryNames = {
  story: "📖 داستان",
  grammar: "📚 گرامر",
  vocab: "🔤 واژگان",
  culture: "🌍 فرهنگ",
  other: "📚 سایر"
};

function renderBooks() {
  const grid = document.getElementById("booksGrid");

  const filtered = currentFilter === "all"
    ? books
    : books.filter(book => book.category === currentFilter);

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="emoji">📭</div>
        <p>کتابی در این دسته وجود ندارد.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(book => `
    <div class="book-card">
      <div class="book-cover">
        <img src="${book.cover}" alt="${escapeHtml(book.title)}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <span class="fallback" style="display:none">📕</span>
        <span class="book-format">${escapeHtml(book.format)}</span>
      </div>

      <div class="book-body">
        <div class="book-meta">
          <span class="book-tag">${categoryNames[book.category] || "📚 سایر"}</span>
          <span class="book-level">${escapeHtml(book.level)}</span>
        </div>

        <div class="book-title">${escapeHtml(book.title)}</div>
        <div class="book-author">✍️ ${escapeHtml(book.author)}</div>
        <div class="book-desc">${escapeHtml(book.desc)}</div>

        <div class="book-footer">
          <span>📄 ${escapeHtml(String(book.pages))} صفحه</span>
          <span>${escapeHtml(book.format)}</span>
        </div>

        <a class="open-btn" href="${book.link}" target="_blank" rel="noopener">
          📖 باز کردن کتاب
        </a>
      </div>
    </div>
  `).join("");
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("filterTabs").addEventListener("click", event => {
  const button = event.target.closest(".filter-tab");
  if (!button) return;

  document.querySelectorAll(".filter-tab")
    .forEach(tab => tab.classList.remove("active"));

  button.classList.add("active");
  currentFilter = button.dataset.filter;
  renderBooks();
});

renderBooks();
</script>
</body>
</html>
