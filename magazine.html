<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="description" content="مجله Darsogame — مقالات و مطالب آموزشی زبان.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجله | Darsogame</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b 50%,#334155);color:#e2e8f0;padding:25px 18px}
.container{max-width:1000px;margin:auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(20,184,166,.15);border:2px solid rgba(20,184,166,.3);border-radius:12px;color:#14b8a6;text-decoration:none;font-weight:900;font-size:13px}
.page-pill{padding:8px 20px;background:linear-gradient(135deg,#14b8a6,#06b6d4);border-radius:20px;color:#0f172a;font-weight:900;font-size:14px}
.page-header{text-align:center;margin-bottom:30px;padding:30px 20px;background:linear-gradient(135deg,rgba(20,184,166,.12),rgba(6,182,212,.12));border-radius:25px;border:2px solid rgba(20,184,166,.25)}
.page-header h1{font-size:32px;font-weight:900;background:linear-gradient(135deg,#14b8a6,#06b6d4,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.page-header p{color:#94a3b8;font-size:14px;line-height:1.7}
.filter-tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}
.filter-tab{padding:10px 18px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;border:2px solid rgba(148,163,184,.25);background:rgba(15,23,42,.6);color:#cbd5e1}
.filter-tab.active{background:linear-gradient(135deg,#14b8a6,#06b6d4);color:#0f172a;border-color:transparent}
.articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.article-card{background:linear-gradient(135deg,#1e293b,#334155);border:3px solid transparent;border-radius:22px;overflow:hidden;transition:.3s;color:inherit;text-decoration:none;display:flex;flex-direction:column}
.article-card:hover{transform:translateY(-7px);box-shadow:0 25px 55px rgba(0,0,0,.5);border-color:#14b8a6}
.article-cover{height:190px;position:relative;background:linear-gradient(135deg,rgba(20,184,166,.15),rgba(6,182,212,.15));display:flex;align-items:center;justify-content:center;overflow:hidden}
.article-cover img{width:100%;height:100%;object-fit:cover}
.article-cover .fallback{font-size:60px}
.article-format{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:8px;background:rgba(15,23,42,.85);color:#fff;font-size:10px;font-weight:900}
.article-body{padding:20px;display:flex;flex-direction:column;flex:1}
.article-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.article-tag,.article-level{padding:4px 10px;border-radius:8px;font-size:10px;font-weight:900}
.article-tag{background:rgba(20,184,166,.15);color:#14b8a6}
.article-level{background:rgba(251,191,36,.15);color:#fbbf24}
.article-title{font-size:17px;font-weight:900;color:#fff;margin-bottom:8px;line-height:1.5}
.article-desc{font-size:13px;color:#94a3b8;line-height:1.7;margin-bottom:14px;flex:1}
.article-footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;font-weight:700;padding-top:12px;border-top:1px solid rgba(148,163,184,.15)}
.open-btn{display:block;margin-top:12px;text-align:center;padding:10px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#06b6d4);color:#0f172a;font-size:12px;font-weight:900}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-state .emoji{font-size:60px;margin-bottom:15px}
@media(max-width:600px){body{padding:15px 10px}.page-header h1{font-size:24px}.articles-grid{grid-template-columns:1fr}.article-cover{height:180px}}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="hub.html" class="back-btn">🏠 بازگشت</a>
    <div class="page-pill">📰 مجله</div>
  </div>

  <div class="page-header">
    <h1>📰 مجله Darsogame</h1>
    <p>مقالات و مطالب آموزشی را مستقیماً در آرایه پایین کد وارد کنید.</p>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">همه</button>
    <button class="filter-tab" data-filter="en">🇬🇧 انگلیسی</button>
    <button class="filter-tab" data-filter="zh">🇨🇳 چینی</button>
    <button class="filter-tab" data-filter="ko">🇰🇷 کره‌ای</button>
    <button class="filter-tab" data-filter="culture">🌍 فرهنگ</button>
  </div>

  <div class="articles-grid" id="articlesGrid"></div>
</div>

<script>
/* =========================================================
   فقط همین بخش را برای اضافه کردن مطلب ویرایش کنید.
   cover = لینک عکس
   link  = لینک صفحه مقاله / PDF / EPUB / ...
   lang  = en | zh | ko | culture
   ========================================================= */


  // مطالب بعدی را با همین ساختار اضافه کنید.
];

let currentFilter = "all";

const languageNames = {
  en: "🇬🇧 انگلیسی",
  zh: "🇨🇳 چینی",
  ko: "🇰🇷 کره‌ای",
  culture: "🌍 فرهنگ"
};

function renderArticles() {
  const grid = document.getElementById("articlesGrid");

  const filtered = currentFilter === "all"
    ? articles
    : articles.filter(article => article.lang === currentFilter);

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="emoji">📭</div>
        <p>مطلبی در این دسته وجود ندارد.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(article => `
    <div class="article-card">
      <div class="article-cover">
        <img src="${article.cover}" alt="${escapeHtml(article.title)}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <span class="fallback" style="display:none">📰</span>
        <span class="article-format">${escapeHtml(article.format)}</span>
      </div>

      <div class="article-body">
        <div class="article-meta">
          <span class="article-tag">${languageNames[article.lang] || "🌍"}</span>
          <span class="article-level">${escapeHtml(article.level)}</span>
        </div>

        <div class="article-title">${escapeHtml(article.title)}</div>
        <div class="article-desc">${escapeHtml(article.desc)}</div>

        <div class="article-footer">
          <span>📅 ${escapeHtml(article.date)}</span>
          <span>⏱ ${escapeHtml(article.readTime)}</span>
        </div>

        <a class="open-btn" href="${article.link}" target="_blank" rel="noopener">
          📰 باز کردن مطلب
        </a>
      </div>
    </div>
  `).join("");
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("filterTabs").addEventListener("click", event => {
  const button = event.target.closest(".filter-tab");
  if (!button) return;

  document.querySelectorAll(".filter-tab")
    .forEach(tab => tab.classList.remove("active"));

  button.classList.add("active");
  currentFilter = button.dataset.filter;
  renderArticles();
});

renderArticles();
</script>
</body>
</html>
