<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="مقالات و راهنماهای یادگیری زبان — بازی زبان">
<title>📚 مقالات — بازی زبان</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --bg-3: #334155;
    --surface: rgba(15, 23, 42, 0.85);
    --surface-2: rgba(30, 41, 59, 0.6);
    --border: rgba(56, 189, 248, 0.3);
    --border-soft: rgba(148, 163, 184, 0.25);
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --accent-1: #38bdf8;
    --accent-2: #a78bfa;
    --accent-3: #fbbf24;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 28px;
    --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.6);
    --shadow-accent: 0 10px 25px rgba(56, 189, 248, 0.4);
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at top, rgba(56, 189, 248, 0.08), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(167, 139, 250, 0.08), transparent 50%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    background-attachment: fixed;
    color: var(--text);
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    line-height: 1.7;
  }

  /* ═══ نوار بالا ═══ */
  .top-bar {
    max-width: 1200px;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px 20px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-lg);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }

  .brand .brand-ico {
    -webkit-text-fill-color: initial;
    font-size: 26px;
  }

  .nav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 8px;
    transition: all var(--transition);
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: var(--accent-1);
    background: rgba(56, 189, 248, 0.1);
  }

  /* ═══ هدر صفحه ═══ */
  .page-header {
    max-width: 1200px;
    margin: 0 auto 30px;
    text-align: center;
  }

  .page-title {
    font-size: 34px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .page-subtitle {
    color: var(--text-muted);
    font-size: 15px;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.9;
  }

  /* ═══ کنترل‌ها: جستجو + فیلتر ═══ */
  .controls {
    max-width: 1200px;
    margin: 0 auto 30px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .search-wrap {
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 16px 50px 16px 16px;
    background: var(--surface);
    border: 2px solid var(--border-soft);
    border-radius: var(--radius-md);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    transition: all var(--transition);
  }

  .search-input:focus {
    outline: none;
    border-color: var(--accent-1);
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
  }

  .search-input::placeholder { color: var(--text-dim); }

  .search-ico {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    pointer-events: none;
    color: var(--text-dim);
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .chip {
    padding: 8px 18px;
    background: rgba(148, 163, 184, 0.12);
    border: 1.5px solid rgba(148, 163, 184, 0.25);
    border-radius: 999px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
  }

  .chip:hover {
    background: rgba(56, 189, 248, 0.12);
    border-color: rgba(56, 189, 248, 0.4);
    color: var(--text);
  }

  .chip.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
  }

  .chip:focus-visible {
    outline: 3px solid var(--accent-3);
    outline-offset: 2px;
  }

  /* ═══ Grid مقالات ═══ */
  .articles-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    padding-bottom: 20px;
  }

  .article-card {
    background: var(--surface-2);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: var(--radius-lg);
    border: 1.5px solid rgba(148, 163, 184, 0.18);
    overflow: hidden;
    transition: all var(--transition);
    display: flex;
    flex-direction: column;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    animation: cardIn 0.4s ease backwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .article-card:hover {
    transform: translateY(-6px);
    border-color: rgba(56, 189, 248, 0.45);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }

  .article-card:focus-visible {
    outline: 3px solid var(--accent-3);
    outline-offset: 3px;
  }

  .article-cover {
    height: 160px;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(167, 139, 250, 0.15));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    position: relative;
    overflow: hidden;
  }

  .article-cover::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.2), transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(167, 139, 250, 0.2), transparent 60%);
  }

  .article-cover .cover-ico {
    position: relative;
    z-index: 1;
  }

  .article-body {
    padding: 22px 22px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .article-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 12px;
    flex-wrap: wrap;
  }

  .article-tag {
    padding: 4px 10px;
    background: rgba(56, 189, 248, 0.12);
    color: var(--accent-1);
    border-radius: 6px;
    font-weight: 700;
  }

  .article-meta .dot { color: var(--text-dim); }

  .article-meta .meta-text { color: var(--text-dim); }

  .article-title {
    font-size: 17px;
    font-weight: 900;
    color: #e2e8f0;
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .article-excerpt {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.9;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 18px;
    flex: 1;
  }

  .read-more {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent-1);
    font-weight: 900;
    font-size: 13.5px;
    margin-top: auto;
  }

  .read-more::after {
    content: '←';
    transition: transform var(--transition);
  }

  .article-card:hover .read-more::after {
    transform: translateX(-4px);
  }

  /* ═══ Empty State ═══ */
  .empty-state {
    max-width: 500px;
    margin: 60px auto;
    text-align: center;
    padding: 40px 20px;
    display: none;
  }

  .empty-state.show { display: block; }

  .empty-ico {
    font-size: 64px;
    display: block;
    margin-bottom: 16px;
    opacity: 0.6;
  }

  .empty-title {
    font-size: 20px;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 8px;
  }

  .empty-desc {
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ═══ فوتر ═══ */
  .site-footer {
    max-width: 1200px;
    margin: 40px auto 0;
    padding: 28px 24px;
    border-top: 1.5px solid rgba(148, 163, 184, 0.15);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--text-dim);
    font-size: 13px;
  }

  .footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
  }

  .footer-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 700;
    transition: color var(--transition);
  }

  .footer-links a:hover { color: var(--accent-1); }

  /* ═══════════ ریسپانسیو ═══════════ */

  @media (max-width: 768px) {
    body { padding: 16px; }
    .top-bar { padding: 14px 16px; margin-bottom: 22px; }
    .brand { font-size: 16px; }
    .brand .brand-ico { font-size: 22px; }
    .nav-links { gap: 8px; }
    .nav-links a { font-size: 13px; padding: 5px 10px; }
    .page-title { font-size: 26px; }
    .page-subtitle { font-size: 14px; }
    .articles-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .site-footer { flex-direction: column; text-align: center; }
    .footer-links { justify-content: center; }
  }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .top-bar { padding: 12px 14px; border-radius: var(--radius-md); }
    .brand { font-size: 15px; gap: 8px; }
    .brand .brand-ico { font-size: 20px; }
    .nav-links { gap: 6px; width: 100%; justify-content: center; }
    .nav-links a { font-size: 12.5px; padding: 5px 9px; }
    .page-title { font-size: 22px; }
    .page-subtitle { font-size: 13px; }
    .search-input { padding: 14px 44px 14px 14px; font-size: 14px; }
    .chip { padding: 7px 14px; font-size: 12.5px; }
    .articles-grid { grid-template-columns: 1fr; gap: 16px; }
    .article-cover { height: 140px; font-size: 54px; }
    .article-body { padding: 18px 18px 20px; }
    .article-title { font-size: 16px; }
    .article-excerpt { font-size: 13px; }
    .site-footer { padding: 22px 16px; font-size: 12px; }
    .footer-links { gap: 14px; font-size: 12px; }
  }

  @media (max-width: 360px) {
    body { padding: 8px; }
    .page-title { font-size: 20px; }
    .search-input { font-size: 13px; padding: 12px 40px 12px 12px; }
    .chip { padding: 6px 12px; font-size: 12px; }
    .article-cover { height: 120px; font-size: 48px; }
    .article-body { padding: 16px 14px 18px; }
    .article-title { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════
   📚 داده‌های مقالات — اینجا می‌توانید مقاله اضافه/ویرایش کنید
   ══════════════════════════════════════════════════════════════ */
const ARTICLES = [
  {
    slug: 'why-game-based-learning',
    title: 'چرا یادگیری بازی‌محور مؤثرتر از روش‌های سنتی است؟',
    excerpt: 'تحقیقات علمی نشان می‌دهد بازی‌سازی می‌تواند ماندگاری مطالب در حافظه را تا ۳ برابر افزایش دهد. در این مقاله به بررسی مکانیزم‌های عصبی و روان‌شناختی این پدیده می‌پردازیم.',

    category: 'مهارت شنیداری',
    icon: '🎧',
    date: '۱۴۰۴/۰۲/۰۵',
    readTime: '۵ دقیقه',
    author: 'تیم محتوا'
  },
  {

/* ═══ دسته‌بندی‌های یکتا ═══ */
const CATEGORIES = ['همه', ...new Set(ARTICLES.map(a => a.category))];

let activeCategory = 'همه';
let searchQuery = '';

/* ═══ رندر چیپ‌های فیلتر ═══ */
function renderChips() {
  const container = document.getElementById('filterChips');
  container.innerHTML = CATEGORIES.map(cat => `
    <button
      class="chip ${cat === activeCategory ? 'active' : ''}"
      data-cat="${cat}"
      role="tab"
      aria-selected="${cat === activeCategory}"
    >${cat}</button>
  `).join('');

  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeCategory = chip.dataset.cat;
      renderChips();
      renderArticles();
    });
  });
}

/* ═══ رندر کارت‌های مقاله ═══ */
function renderArticles() {
  const grid = document.getElementById('articlesGrid');
  const empty = document.getElementById('emptyState');

  const filtered = ARTICLES.filter(a => {
    const matchCat = activeCategory === 'همه' || a.category === activeCategory;
    const q = searchQuery.trim().toLowerCase();
    const matchSearch = !q
      || a.title.toLowerCase().includes(q)
      || a.excerpt.toLowerCase().includes(q)
      || a.category.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }

  empty.classList.remove('show');

  grid.innerHTML = filtered.map((a, i) => `
    <a
      href="article.html?slug=${encodeURIComponent(a.slug)}"
      class="article-card"
      style="animation-delay: ${i * 0.05}s"
    >
      <div class="article-cover">
        <span class="cover-ico" aria-hidden="true">${a.icon}</span>
      </div>
      <div class="article-body">
        <div class="article-meta">
          <span class="article-tag">${a.category}</span>
          <span class="dot">•</span>
          <span class="meta-text">${a.readTime}</span>
          <span class="dot">•</span>
          <span class="meta-text">${a.date}</span>
        </div>
        <h2 class="article-title">${a.title}</h2>
        <p class="article-excerpt">${a.excerpt}</p>
        <span class="read-more">ادامه مطلب</span>
      </div>
    </a>
  `).join('');
}

/* ═══ راه‌اندازی ═══ */
document.addEventListener('DOMContentLoaded', () => {
  renderChips();
  renderArticles();

  const searchInput = document.getElementById('searchInput');
  let searchTimer;

  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value;
      renderArticles();
    }, 200);
  });
});
</script>
