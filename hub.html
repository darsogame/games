<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">\n<meta name="description" content="ورود به بخش‌های اصلی Darsogame و تمرین مهارت‌های مختلف زبان.">\n<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منوی اصلی بازی زبان | Darsogame</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    color: #e2e8f0;
    padding: 30px 20px;
    overflow-x: hidden;
  }

  .container { max-width: 1000px; margin: 0 auto; }

  /* ═══ هدر ═══ */
  .hub-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
    flex-wrap: wrap;
    gap: 15px;
    padding: 25px;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(167, 139, 250, 0.1));
    border-radius: 25px;
    border: 2px solid rgba(56, 189, 248, 0.2);
  }

  .hub-user-info {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .user-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
  }

  .user-details h2 {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 5px;
  }

  .user-details p {
    font-size: 12px;
    color: #94a3b8;
    font-family: 'Courier New', monospace;
    direction: ltr;
  }

  .logout-btn {
    background: rgba(239, 68, 68, 0.15);
    border: 2px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 12px 22px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .logout-btn:hover {
    background: rgba(239, 68, 68, 0.3);
    transform: translateY(-2px);
  }

  /* ═══ عنوان ═══ */
  .hub-title {
    text-align: center;
    margin-bottom: 15px;
  }

  .hub-title h1 {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(135deg, #38bdf8, #a78bfa, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .hub-title p {
    color: #94a3b8;
    font-size: 15px;
    line-height: 1.7;
  }

  .keyboard-hint {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(251, 191, 36, 0.15);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 20px;
    font-size: 13px;
    color: #fbbf24;
    font-weight: 700;
    margin-top: 15px;
  }

  .keyboard-hint kbd {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 6px;
    padding: 2px 8px;
    font-family: 'Courier New', monospace;
    font-weight: 900;
    color: #fbbf24;
  }

  /* ═══ گرید امکانات ═══ */
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }

  .feature-card {
    position: relative;
    background: linear-gradient(135deg, #1e293b, #334155);
    border: 3px solid transparent;
    border-radius: 22px;
    padding: 30px 22px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    outline: none;
  }

  .feature-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 60%);
    transition: transform 0.5s;
    pointer-events: none;
  }

  .feature-card:hover,
  .feature-card:focus {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-card:focus {
    border-color: #fbbf24;
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-card.active {
    border-color: #fbbf24;
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  /* رنگ‌های مختلف هر کارت */
  .feature-card[data-color="blue"]:hover,
  .feature-card[data-color="blue"]:focus,
  .feature-card[data-color="blue"].active {
    border-color: #38bdf8;
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-card[data-color="green"]:hover,
  .feature-card[data-color="green"]:focus,
  .feature-card[data-color="green"].active {
    border-color: #22c55e;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-card[data-color="purple"]:hover,
  .feature-card[data-color="purple"]:focus,
  .feature-card[data-color="purple"].active {
    border-color: #a78bfa;
    box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-card[data-color="red"]:hover,
  .feature-card[data-color="red"]:focus,
  .feature-card[data-color="red"].active {
    border-color: #ef4444;
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-card[data-color="yellow"]:hover,
  .feature-card[data-color="yellow"]:focus,
  .feature-card[data-color="yellow"].active {
    border-color: #fbbf24;
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-card[data-color="cyan"]:hover,
  .feature-card[data-color="cyan"]:focus,
  .feature-card[data-color="cyan"].active {
    border-color: #06b6d4;
    box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.3), 0 25px 55px rgba(0, 0, 0, 0.5);
  }

  .feature-icon {
    font-size: 54px;
    display: block;
    margin-bottom: 15px;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
  }

  .feature-name {
    font-size: 19px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 8px;
  }

  .feature-desc {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.7;
    margin-bottom: 15px;
  }

  .feature-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 900;
    background: rgba(148, 163, 184, 0.2);
    color: #cbd5e1;
  }

  /* ═══ پاورقی ═══ */
  .hub-footer {
    margin-top: 40px;
    text-align: center;
    color: #64748b;
    font-size: 13px;
    line-height: 1.8;
  }

  .hub-footer kbd {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 6px;
    padding: 3px 10px;
    font-family: 'Courier New', monospace;
    font-weight: 900;
    color: #cbd5e1;
    margin: 0 3px;
  }

  /* ═══ هشدار دسترسی ═══ */
  .access-warning {
    background: rgba(251, 191, 36, 0.1);
    border: 2px solid rgba(251, 191, 36, 0.3);
    color: #fbbf24;
    padding: 18px 22px;
    border-radius: 15px;
    margin-bottom: 25px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.7;
    display: none;
  }

  .access-warning.show { display: block; }

  /* ═══ رسیپانسیو ═══ */
  @media (max-width: 640px) {
    body { padding: 15px 12px; }
    .hub-title h1 { font-size: 26px; }
    .hub-title p { font-size: 13px; }
    .features-grid { grid-template-columns: 1fr; }
    .feature-card { padding: 22px 18px; }
    .feature-icon { font-size: 44px; }
    .feature-name { font-size: 17px; }
    .hub-header { padding: 18px; }
    .user-avatar { width: 50px; height: 50px; font-size: 24px; }
    .user-details h2 { font-size: 16px; }
    .logout-btn { padding: 10px 16px; font-size: 13px; }
  }
</style>
<link rel="canonical" href="https://darsogame.github.io/games/hub.html">\n</head>
<body>

<div class="container">

  <!-- ═══ هدر ═══ -->
  <div class="hub-header">
    <div class="hub-user-info">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-details">
        <h2 id="userName">در حال بارگذاری...</h2>
        <p id="userIP">IP: —</p>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">
      🚪 خروج
    </button>
  </div>

  <!-- ═══ عنوان ═══ -->
  <div class="hub-title">
    <h1>🎮 منوی اصلی</h1>
    <p>با کلیدهای جهت‌دار انتخاب کن و Enter بزن</p>
    <div class="keyboard-hint">
      <kbd>◀</kbd> <kbd>▶</kbd> <kbd>▲</kbd> <kbd>▼</kbd> برای حرکت — <kbd>Enter</kbd> برای انتخاب
    </div>
  </div>

  <div class="access-warning" id="accessWarning"></div>

  <!-- ═══ گرید امکانات ═══ -->
  <div class="features-grid" id="featuresGrid"></div>

  <!-- ═══ پاورقی ═══ -->
  <div class="hub-footer">
    <p>
      📌 برای انتخاب گزینه، از <kbd>Tab</kbd> یا کلیدهای جهت‌دار استفاده کن<br>
      و با <kbd>Enter</kbd> وارد شو
    </p>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   🏠 Hub — منوی اصلی با ناوبری کیبورد
   ══════════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'lingo_auth';

/* ═══ تعریف امکانات ═══ */
const features = [
  {
    id: 'game',
    name: 'بازی اصلی',
    desc: 'بازی چند مرحله‌ای زبان‌آموزی',
    icon: '🎮',
    url: 'index2.html',
    color: 'blue',
    tag: 'مرحله‌ای'
  },
  {
    id: 'lesson',
    name: 'درسنامه',
    desc: 'یادگیری کلمات با مثال و گرامر',
    icon: '📖',
    url: 'lesson.html',
    color: 'green',
    tag: 'آموزشی'
  },
  {
    id: 'listening',
    name: 'شنیداری',
    desc: 'گوش کن و بنویس',
    icon: '🎧',
    url: 'listening.html',
    color: 'purple',
    tag: 'مهارتی'
  },
  {
    id: 'reading',
    name: 'خواندن',
    desc: 'داستان بخوان و پاسخ بده',
    icon: '📚',
    url: 'reading.html',
    color: 'yellow',
    tag: 'مهارتی'
  },
  {
    id: 'writing',
    name: 'نوشتن',
    desc: 'جملات را بساز و ترجمه کن',
    icon: '✍️',
    url: 'writing.html',
    color: 'cyan',
    tag: 'مهارتی'
  },
  {
    id: 'speaking',
    name: 'مکالمه',
    desc: 'با میکروفون صحبت کن',
    icon: '🎤',
    url: 'speaking.html',
    color: 'red',
    tag: 'مهارتی'
  }
];

let currentFocusIndex = 0;
let session = null;

/* ═══ بارگذاری session ═══ */
function loadSession() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return null;
    return JSON.parse(stored);
  } catch (err) {
    return null;
  }
}

/* ═══ بررسی دسترسی ═══ */
function hasAccess(featureId) {
  if (!session) return false;
  if (!session.permissions) return false;
  return session.permissions.includes(featureId);
}

/* ═══ رندر گرید ═══ */
function renderFeatures() {
  const grid = document.getElementById('featuresGrid');
  grid.innerHTML = '';

  let blockedCount = 0;

  features.forEach((feature, index) => {
    const accessible = hasAccess(feature.id);
    
    if (!accessible) blockedCount++;

    const card = document.createElement('a');
    card.className = 'feature-card';
    card.href = accessible ? feature.url : '#';
    card.dataset.color = feature.color;
    card.dataset.featureId = feature.id;
    card.dataset.index = index;

    if (!accessible) {
      card.style.opacity = '0.4';
      card.style.cursor = 'not-allowed';
      card.style.filter = 'grayscale(0.7)';
    }

    card.innerHTML = `
      <span class="feature-icon">${accessible ? feature.icon : '🔒'}</span>
      <div class="feature-name">${feature.name}</div>
      <div class="feature-desc">${feature.desc}</div>
      <span class="feature-tag">${accessible ? feature.tag : 'قفل'}</span>
    `;

    card.addEventListener('click', (e) => {
      if (!accessible) {
        e.preventDefault();
        showAccessDenied(feature.name);
        return;
      }
    });

    grid.appendChild(card);
  });

  // اگر مهمان است، هشدار نشان بده
  if (session && session.type === 'guest') {
    const warning = document.getElementById('accessWarning');
    warning.classList.add('show');
    warning.innerHTML = `
      👤 <strong>شما به‌عنوان مهمان وارد شده‌اید.</strong><br>
      فقط به «بازی اصلی» دسترسی دارید. برای دسترسی به همه امکانات، با کد کاربری وارد شوید.
    `;
  }

  if (blockedCount > 0 && session && session.type === 'user') {
    const warning = document.getElementById('accessWarning');
    warning.classList.add('show');
    warning.innerHTML = `
      🔒 <strong>${blockedCount} امکان برای شما قفل است.</strong><br>
      برای دسترسی، با مدیر تماس بگیرید.
    `;
  }
}

/* ═══ نمایش پیام عدم دسترسی ═══ */
function showAccessDenied(featureName) {
  const warning = document.getElementById('accessWarning');
  warning.classList.add('show');
  warning.innerHTML = `
    🚫 <strong>شما به «${featureName}» دسترسی ندارید!</strong><br>
    برای دسترسی، با مدیر تماس بگیرید.
  `;
  warning.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ═══ به‌روزرسانی اطلاعات کاربر ═══ */
function updateUserInfo() {
  if (!session) {
    document.getElementById('userName').textContent = 'کاربر ناشناس';
    return;
  }

  document.getElementById('userName').textContent = session.name || 'کاربر';
  document.getElementById('userIP').textContent = 'IP: ' + (session.ip || '—');
  
  const avatar = document.getElementById('userAvatar');
  if (session.type === 'guest') {
    avatar.textContent = '👤';
  } else {
    avatar.textContent = '👑';
  }
}

/* ═══ ناوبری با کلیدهای جهت‌دار ═══ */
function setupKeyboardNavigation() {
  document.addEventListener('keydown', (e) => {
    const cards = Array.from(document.querySelectorAll('.feature-card'));
    if (cards.length === 0) return;

    // محاسبه گرید
    const grid = document.getElementById('featuresGrid');
    const columns = window.getComputedStyle(grid).gridTemplateColumns.split(' ').length;

    if (e.key === 'ArrowRight') {
      e.preventDefault();
      currentFocusIndex = (currentFocusIndex + 1) % cards.length;
      focusCard(cards[currentFocusIndex]);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      currentFocusIndex = (currentFocusIndex - 1 + cards.length) % cards.length;
      focusCard(cards[currentFocusIndex]);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      currentFocusIndex = (currentFocusIndex + columns) % cards.length;
      focusCard(cards[currentFocusIndex]);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      currentFocusIndex = (currentFocusIndex - columns + cards.length) % cards.length;
      focusCard(cards[currentFocusIndex]);
    } else if (e.key === 'Enter') {
      const card = cards[currentFocusIndex];
      if (card) {
        card.click();
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      logout();
    }
  });
}

function focusCard(card) {
  document.querySelectorAll('.feature-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  card.focus();
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ═══ خروج ═══ */
function logout() {
  if (confirm('🚪 آیا می‌خواهید خارج شوید؟')) {
    localStorage.removeItem(STORAGE_KEY);
    window.location.href = 'index.html';
  }
}

/* ═══ راه‌اندازی ═══ */
window.addEventListener('load', () => {
  session = loadSession();

  if (!session) {
    // اگر session نیست، به login برو
    window.location.href = 'index.html';
    return;
  }

  updateUserInfo();
  renderFeatures();
  setupKeyboardNavigation();

  // فوکوس روی اولین کارت
  setTimeout(() => {
    const firstCard = document.querySelector('.feature-card');
    if (firstCard) focusCard(firstCard);
  }, 100);
});
</script>

</body>
</html>
