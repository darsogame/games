<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<title>کره‌ای TOPIK I-2 - پایه | Darsogame</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>

  .progress-bar { height: 12px; background: rgba(148,163,184,0.2);

  .progress-fill { height: 100%; width: 0%;

  .korean-word { font-size: 52px; font-weight: 900; color: #22c55e;

function init() {
  currentStage = 0;
  score = 0;
  mcAnswered = {};
  renderStage();
}

function updateProgress() {
  const stageLabel = document.getElementById('stageLabel');
  const scoreLabel = document.getElementById('scoreLabel');
  const progressFill = document.getElementById('progressFill');
  if (stageLabel) stageLabel.textContent = currentStage < TOTAL_STAGES ? `مرحله ${currentStage + 1} از ${TOTAL_STAGES}` : 'پایان آزمون';
  if (scoreLabel) scoreLabel.textContent = `امتیاز: ${score}`;
  if (progressFill) progressFill.style.width = Math.min(100, (currentStage / TOTAL_STAGES) * 100) + '%';
}

function renderStage() {
  updateProgress();
  const container = document.getElementById('sceneContainer');
  if (!container) return;
  const stage = stages[currentStage];
  if (!stage) { renderResult(); return; }

  const header = `<div class="scene-header"><span class="scene-icon">${stage.icon}</span>
    <div class="scene-titles"><h3>${stage.title}</h3><p>${stage.subtitle}</p></div></div>`;
  let body = '';
  switch (stage.type) {
    case 'multiple-choice': body = renderMultipleChoice(stage.questions); break;
    case 'listening': body = renderListening(stage.questions); break;
    case 'reading': body = renderReading(stage.passages); break;
    case 'writing': body = renderWriting(stage.questions); break;
    case 'speaking': body = renderSpeaking(stage.questions); break;
    case 'sentence': body = renderSentence(stage.questions); break;
    case 'listening-sentence': body = renderListeningSentence(stage.questions); break;
    case 'mixed': body = renderMixed(stage.questions); break;
    default: body = '<p>این مرحله قابل نمایش نیست.</p>';
  }
  container.innerHTML = `<div class="scene-card">${header}${body}</div>`;
}

function escapeAttr(value) {
  return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function renderMultipleChoice(questions) {
  let html = '<div>';
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px" data-q="${i}">
      <div class="question-text">${q.prompt}</div>
      <div class="options-grid">
        ${shuffle(q.options).map(opt => `<button class="option-btn" onclick="checkMC(this, '${escapeAttr(opt)}', '${escapeAttr(q.answer)}', 'M${i}')">${opt}</button>`).join('')}
      </div></div>`;
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let mcAnswered = {};
function checkMC(btn, selected, answer, qIndex) {
  if (mcAnswered[qIndex]) return;
  mcAnswered[qIndex] = true;
  const parent = btn.closest('.options-grid');
  if (!parent) return;
  parent.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  if (selected === answer) {
    btn.classList.add('correct');
    score += 10;
  } else {
    btn.classList.add('wrong');
    parent.querySelectorAll('.option-btn').forEach(b => {
      if (b.textContent.trim() === answer) b.classList.add('correct');
    });
  }
  updateProgress();
}

function playWord(text, lang='ko-KR') {
  if (!('speechSynthesis' in window)) {
    alert('مرورگر شما از پخش صوت پشتیبانی نمی‌کند.');
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function renderListening(questions) {
  let html = '<div>';
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px" data-q="L${i}">
      <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="playWord('${escapeAttr(q.word)}','${escapeAttr(q.lang || 'ko-KR')}')">🔊 پخش کلمه ${i + 1}</button>
      <div class="options-grid" style="margin-top:12px">
        ${shuffle(q.options).map(opt => `<button class="option-btn" onclick="checkMC(this, '${escapeAttr(opt)}', '${escapeAttr(q.answer)}', 'L${i}')">${opt}</button>`).join('')}
      </div></div>`;
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function renderReading(passages) {
  let html = '<div>';
  passages.forEach((p, i) => {
    html += `<div style="margin-bottom:26px;padding:18px;background:rgba(15,23,42,.5);border-radius:14px">
      <p style="font-size:18px;line-height:1.8;color:#fff;margin-bottom:8px;direction:ltr;text-align:left">${p.text}</p>
      <p style="font-size:13px;line-height:1.8;color:#38bdf8;margin-bottom:14px;direction:ltr;text-align:left;font-family:'Courier New',monospace">${p.romanization}</p>
      <div class="question-text">${p.question}</div>
      <div class="options-grid">
        ${shuffle(p.options).map(opt => `<button class="option-btn" onclick="checkMC(this, '${escapeAttr(opt)}', '${escapeAttr(p.answer)}', 'R${i}')">${opt}</button>`).join('')}
      </div></div>`;
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function renderWriting(questions) {
  let html = '<div>';
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:20px" data-q="W${i}">
      <div class="question-text">«${q.prompt}» را به کره‌ای بنویس (یا رومانیزاسیون):</div>
      <div class="question-hint">راهنما: ${q.hint}</div>
      <input type="text" class="text-input" id="writeInput${i}" placeholder="Type here..." dir="ltr">
      <button class="btn btn-secondary" style="margin-top:10px" onclick="checkWrite(${i})">بررسی</button>
      <div class="feedback" id="writeFb${i}"></div></div>`;
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function checkWrite(i) {
  const q = stages[currentStage].questions[i];
  const input = document.getElementById('writeInput' + i);
  const fb = document.getElementById('writeFb' + i);
  if (!input || input.disabled || !input.value.trim()) return;
  const val = input.value.trim().toLowerCase();
  const correct = val === q.answer.toLowerCase() || (q.alt && val === q.alt.toLowerCase());
  if (correct) {
    input.classList.add('correct');
    fb.className = 'feedback success show';
    fb.textContent = '✅ عالی! درست است.';
    score += 10;
  } else {
    input.classList.add('wrong');
    fb.className = 'feedback error show';
    fb.textContent = `❌ پاسخ درست: ${q.answer}${q.alt ? ' یا ' + q.alt : ''}`;
  }
  input.disabled = true;
  updateProgress();
}

function renderSpeaking(questions) {
  let html = '<div>';
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px;padding:18px;background:rgba(15,23,42,.5);border-radius:14px">
      <div class="korean-word">${q.word}</div>
      <div class="romanization">${q.romanization}</div>
      <p style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:14px">ترجمه: ${q.translation}</p>
      <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="playWord('${escapeAttr(q.word)}','ko-KR')">🔊 تلفظ</button>
    </div>`;
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function renderSentence(questions) {
  let html = '<div>';
  questions.forEach((q, i) => {
    const id = 'sent' + i;
    html += `<div style="margin-bottom:24px" id="${id}">
      <div class="question-text">کلمات را به ترتیب درست بچین:</div>
      <div class="options-grid" id="${id}opts">
        ${shuffle(q.words).map(w => `<button class="option-btn" onclick="addWord('${id}','${escapeAttr(w)}',this)">${w}</button>`).join('')}
      </div>
      <div id="${id}answer" style="min-height:45px;margin-top:12px;padding:12px;border:1px dashed rgba(34,197,94,.3);border-radius:12px"></div>
      <button class="btn btn-secondary" style="margin-top:10px" onclick="checkSentence('${id}', '${escapeAttr(q.answer)}', '${escapeAttr(q.translation)}')">بررسی</button>
      <div class="feedback" id="${id}fb"></div>
    </div>`;
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function addWord(id, word, btn) {
  if (btn.disabled) return;
  const box = document.getElementById(id + 'answer');
  const span = document.createElement('span');
  span.textContent = (box.textContent ? box.textContent + ' ' : '') + word;
  box.textContent = span.textContent;
  btn.disabled = true;
}

function checkSentence(id, answer, translation) {
  const box = document.getElementById(id + 'answer');
  const fb = document.getElementById(id + 'fb');
  const val = box.textContent.trim();
  if (!val || fb.classList.contains('show')) return;
  if (val === answer) {
    fb.className = 'feedback success show'; fb.textContent = '✅ درست است!'; score += 10;
  } else {
    fb.className = 'feedback error show'; fb.textContent = `❌ پاسخ درست: ${answer} — ${translation}`;
  }
  updateProgress();
}

function renderListeningSentence(questions) {
  let html = '<div>';
  questions.forEach((q, i) => {
    html += `<div style="margin-bottom:22px">
      <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="playWord('${escapeAttr(q.sentence)}','${escapeAttr(q.lang || 'ko-KR')}')">🔊 پخش جمله ${i + 1}</button>
      <div class="options-grid" style="margin-top:12px">
        ${shuffle(q.options).map(opt => `<button class="option-btn" onclick="checkMC(this, '${escapeAttr(opt)}', '${escapeAttr(q.answer)}', 'LS${i}')">${opt}</button>`).join('')}
      </div></div>`;
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function renderMixed(questions) {
  let html = '<div>';
  questions.forEach((q, i) => {
    if (q.type === 'mc') {
      html += `<div style="margin-bottom:22px"><div class="question-text">${q.prompt}</div><div class="options-grid">
        ${shuffle(q.options).map(opt => `<button class="option-btn" onclick="checkMC(this, '${escapeAttr(opt)}', '${escapeAttr(q.answer)}', 'X${i}')">${opt}</button>`).join('')}
      </div></div>`;
    } else if (q.type === 'write') {
      html += `<div style="margin-bottom:22px"><div class="question-text">${q.prompt}</div><input id="mixInput${i}" class="text-input" dir="ltr" placeholder="Type here..."><button class="btn btn-secondary" style="margin-top:10px" onclick="checkMixedWrite(${i})">بررسی</button><div class="feedback" id="mixFb${i}"></div></div>`;
    }
  });
  return html + `<div class="btn-row"><button class="btn btn-primary" onclick="nextStage()">ادامه ➜</button></div></div>`;
}

function checkMixedWrite(i) {
  const q = stages[currentStage].questions[i];
  const input = document.getElementById('mixInput' + i);
  const fb = document.getElementById('mixFb' + i);
  if (!input || input.disabled || !input.value.trim()) return;
  const val = input.value.trim().toLowerCase();
  if (val === q.answer.toLowerCase() || (q.alt && val === q.alt.toLowerCase())) {
    input.classList.add('correct'); fb.className = 'feedback success show'; fb.textContent = '✅ درست است!'; score += 10;
  } else {
    input.classList.add('wrong'); fb.className = 'feedback error show'; fb.textContent = `❌ پاسخ درست: ${q.answer}`;
  }
  input.disabled = true; updateProgress();
}

function nextStage() {
  currentStage++;
  mcAnswered = {};
  if (currentStage >= TOTAL_STAGES) renderResult();
  else renderStage();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderResult() {
  updateProgress();
  const percent = Math.round((score / 100) * 100);
  const emoji = percent >= 80 ? '🎉' : percent >= 60 ? '👏' : '💪';
  document.getElementById('sceneContainer').innerHTML = `<div class="scene-card result-screen">
    <div class="result-emoji">${emoji}</div><div class="result-title">آزمون تمام شد!</div>
    <div class="result-score">${score}</div><div class="result-sub">امتیاز کسب‌شده</div>
    <button class="btn btn-primary" onclick="init()">🔄 شروع دوباره</button>
  </div>`;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
